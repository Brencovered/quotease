# Free weekly directory maintenance. No Google Places, no paid search API.
#
# Secrets this workflow reads (set under Settings → Secrets and variables →
# Actions). Do not commit the values.
#
#   SUPABASE_URL                 project URL, https://<ref>.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY    service role key (bypasses RLS). Server only.
#   ABN_LOOKUP_GUID              free GUID from
#                                https://abr.business.gov.au/Tools/WebServices
#                                MX checks still run if this is unset. ABN
#                                status stays due until it is set.
#
# The admin "ABN directory growth" panel starts this workflow. That server
# needs its own token, which is NOT a secret of this workflow:
#
#   GITHUB_ACTIONS_DISPATCH_TOKEN   Vercel (or .env.local). Fine-grained PAT
#                                   with Actions read and write on this repo,
#                                   or a classic token with the workflow scope.
#
# Optional repository variables:
#   ABN_ENRICH_LIMIT             default 800 candidates per run
#   DIRECTORY_VERIFY_LIMIT       default 2000 listings per run
#
# Optional server env (the Next.js app, not this workflow):
#   GITHUB_REPOSITORY            owner/name, default Brencovered/quotease
#   ABN_WORKFLOW_REF             git ref to dispatch, default main
#
# The job downloads each ABR zip once, stream-parses it, bulk-inserts trade
# matches, guesses websites in parallel, then re-checks ABNs and email MX
# records (DNS only — it never sends email). Anything verified more than
# 90 days ago is checked again. Progress is written to abn_directory_runs
# so the admin page can poll it.

name: ABN directory

on:
  schedule:
    # Sunday 16:00 UTC. The ABR bulk extract is published weekly.
    - cron: "0 16 * * 0"
  workflow_dispatch:
    inputs:
      phase:
        description: "all, ingest, enrich, or verify"
        required: false
        default: all
        type: choice
        options:
          - all
          - ingest
          - enrich
          - verify
      run_id:
        description: "abn_directory_runs id. Leave empty for a manual or scheduled run."
        required: false
        default: ""
        type: string

concurrency:
  group: abn-directory
  cancel-in-progress: false

jobs:
  pipeline:
    name: Ingest, enrich, verify
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Mark run started
        if: ${{ github.event.inputs.run_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_GITHUB_ID: ${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "$SUPABASE_URL/rest/v1/abn_directory_runs?id=eq.${RUN_ID}" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"status\":\"running\",\"github_run_url\":\"${RUN_URL}\",\"github_run_id\":\"${RUN_GITHUB_ID}\",\"message\":\"GitHub Actions runner started. Installing dependencies.\",\"started_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run directory pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ABN_LOOKUP_GUID: ${{ secrets.ABN_LOOKUP_GUID }}
          ABN_ENRICH_LIMIT: ${{ vars.ABN_ENRICH_LIMIT }}
          DIRECTORY_VERIFY_LIMIT: ${{ vars.DIRECTORY_VERIFY_LIMIT }}
          ABN_DIRECTORY_RUN_ID: ${{ github.event.inputs.run_id }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: npx tsx scripts/abn-directory-pipeline.ts --phase "${{ github.event.inputs.phase || 'all' }}"

      - name: Mark run failed
        if: ${{ failure() && github.event.inputs.run_id != '' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ github.event.inputs.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --url "$SUPABASE_URL/rest/v1/abn_directory_runs?id=eq.${RUN_ID}&status=neq.done" \
            --header "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            --header "Content-Type: application/json" \
            --header "Prefer: return=minimal" \
            --data "{\"status\":\"failed\",\"github_run_url\":\"${RUN_URL}\",\"message\":\"A workflow step failed. Open the Actions log.\",\"finished_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\",\"updated_at\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}"
