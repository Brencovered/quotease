<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build Planner</title>
<style>
@font-face{font-family:"Archivo";font-weight:400;font-display:swap;src:url(/planner/vendor/archivo-400.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:600;font-display:swap;src:url(/planner/vendor/archivo-600.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:700;font-display:swap;src:url(/planner/vendor/archivo-700.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:800;font-display:swap;src:url(/planner/vendor/archivo-800.woff2) format("woff2");}
.tpl{display:flex;gap:8px;align-items:center;margin:4px 0 6px;}
.desc textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:10px 12px;font-size:14px;line-height:1.4;}
.desc .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.desc .btn.rec{background:var(--bad);color:#fff;border-color:var(--bad);}
.descmsg{margin:8px 0 0;font-size:12.5px;color:var(--muted);}
.descmsg.err{color:var(--bad);}
.descmsg ul{margin:4px 0 0;padding-left:18px;}
.descmsg a{color:inherit;font-weight:700;}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.traceoffer{margin-top:10px;padding:10px 12px;border:1px solid var(--accent);border-radius:10px;background:color-mix(in srgb,var(--accent) 12%,transparent);color:var(--text);font-size:13px;}
.traceoffer .primary{display:block;margin-top:8px;}
.upl .note{margin:0;flex:1;min-width:160px;}
.savetpl{display:flex;gap:8px;margin-top:8px;}
.card.trade{margin-top:10px;}
.card.trade .row{padding:6px 0;}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px;}
.scope .note{margin:0 4px 0 0;}
.mi .pbk{display:block;font-size:11.5px;color:var(--ok);}
.dwg .sv{fill:#fff;stroke:#1f2a33;stroke-width:1.5;}
.dwg .svl{fill:#f2b705;stroke:#1f2a33;stroke-width:1;}
.dwg .svb{fill:#cfd6da;stroke:#1f2a33;stroke-width:1.5;}
.dwg .svd{fill:#2f6fb0;stroke:#1f2a33;stroke-width:1;fill-opacity:0.85;}
.savetpl input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:7px 10px;}
.tpl select{flex:1;min-width:0;}
.lab .mrow{grid-template-columns:1fr auto;}
.lab .inp input{width:72px;}
.ttl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:10px;font-size:13.5px;}
.ttl b{text-align:right;font-variant-numeric:tabular-nums;}
.ttl .big{font-size:15px;font-weight:800;}
body.embed .ph{padding:10px 18px 8px;}
body.embed .ph p{display:none;}
:root{
  --bg:#e9edef; --panel:#f7f9fa; --text:#1f2a33; --muted:#5d6b75; --line:#d3dade; --field:#ffffff;
  --accent:#f2b705; --accent-ink:#1f2a33; --ink:#22303a; --chip:#e3e8eb; --chip-on:#22303a; --chip-on-ink:#f7f9fa;
  --scene-bg:#dce4e8; --scene-ground:#b7c0a8; --grid1:#7f8a75; --grid2:#9ca690;
  --ok:#2f7d4a; --bad:#b8362b; --pine:#d9b47a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a20; --panel:#18222a; --text:#e6ebee; --muted:#93a3ad; --line:#2a3741; --field:#1f2b34;
    --accent:#f2b705; --accent-ink:#1a1400; --ink:#e6ebee; --chip:#22303a; --chip-on:#f2b705; --chip-on-ink:#1a1400;
    --scene-bg:#1a242c; --scene-ground:#2b3327; --grid1:#4b5645; --grid2:#3a4336;
    --ok:#5cc07c; --bad:#ef6b5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a20; --panel:#18222a; --text:#e6ebee; --muted:#93a3ad; --line:#2a3741; --field:#1f2b34;
  --accent:#f2b705; --accent-ink:#1a1400; --ink:#e6ebee; --chip:#22303a; --chip-on:#f2b705; --chip-on-ink:#1a1400;
  --scene-bg:#1a242c; --scene-ground:#2b3327; --grid1:#4b5645; --grid2:#3a4336;
  --ok:#5cc07c; --bad:#ef6b5e;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;overflow:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
.app{display:grid;grid-template-columns:minmax(330px,380px) 1fr;height:100%;}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:38px;height:38px;flex:none;}
h1{margin:0;font-size:22px;line-height:1;font-weight:800;font-stretch:118%;letter-spacing:-0.01em;}
.ph p{margin:3px 0 0;color:var(--muted);font-size:13px;}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:0;padding:10px 2px 9px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;font-stretch:96%;}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tabbody{flex:1;overflow:auto;padding:4px 18px 28px;-webkit-overflow-scrolling:touch;}
.tab{display:none;}
.tab.on{display:block;}
h3{margin:20px 0 8px;font-size:13px;font-weight:700;font-stretch:110%;color:var(--muted);}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;}
.row>span:first-child{font-size:14px;}
.inp{display:inline-flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.inp input{width:92px;border:0;background:transparent;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums;}
.inp em{font-style:normal;color:var(--muted);font-size:12px;padding:0 9px 0 2px;min-width:24px;}
.inp.sm input{width:70px;padding:5px 6px;}
select{max-width:210px;}
select,.textin{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:130px;}
.textin{width:100%;}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink);}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:2px;}
.colsel{display:inline-flex;align-items:center;gap:8px;}
.colsel i{width:22px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.25);display:inline-block;}
.summary{margin-top:18px;padding:12px 14px;border-radius:8px;background:var(--chip);font-size:13.5px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;}
.summary b{font-weight:700;text-align:right;}
.note{color:var(--muted);font-size:12.5px;margin:12px 0 0;max-width:60ch;}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;background:var(--field);}
.cardh{display:flex;gap:6px;align-items:center;}
.cardh select{min-width:0;flex:1;}
.x{border:0;background:none;color:var(--muted);font-size:16px;width:32px;height:32px;border-radius:6px;cursor:pointer;flex:none;}
.x:hover{background:var(--chip);color:var(--bad);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;}
.grid2 label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);}
.grid2 .inp input{width:100%;}
.grid2 .inp{width:100%;}
.warn{font-size:12.5px;color:var(--bad);margin-top:6px;min-height:0;}
.warn:empty{display:none;}
.empty{color:var(--muted);font-size:14px;padding:14px 0;}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.libbtn{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;}
.libbtn:hover{border-color:var(--ink);}
.libbtn b{font-size:13.5px;font-weight:650;}
.libbtn small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;}
.ilist{display:flex;flex-direction:column;gap:4px;}
.irow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer;text-align:left;width:100%;}
.irow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.irow .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2);}
.irow .nm{flex:1;min-width:0;font-size:14px;}
.irow .nm small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);}
.badge.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);}
.editor{margin-top:12px;padding:12px;border-radius:8px;background:var(--chip);}
.editor .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.btn{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;}
.btn.danger{color:var(--bad);}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;}
.mtable{display:flex;flex-direction:column;}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);}
.mi b{font-weight:650;font-size:14px;}
.mi .sz{color:var(--muted);font-size:12.5px;margin-left:4px;}
.mi small{display:block;color:var(--muted);font-size:12px;}

.mq{grid-column:1;font-size:12.5px;font-variant-numeric:tabular-nums;}
.mp{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.cost{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 12px;padding:12px 14px;border-radius:8px;background:var(--ink);color:var(--panel);}
.total b{font-size:20px;font-stretch:115%;font-variant-numeric:tabular-nums;}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;}
#viewport{position:absolute;inset:0;}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.tag{position:absolute;left:0;top:0;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums;font-stretch:92%;box-shadow:0 1px 0 rgba(0,0,0,.25);}
.tbar{position:absolute;display:flex;flex-wrap:wrap;gap:6px;}
.tbar.views{top:12px;right:12px;justify-content:flex-end;}
.tbar.layers{left:12px;bottom:12px;right:12px;align-items:center;}
.tbar .chip{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.tbar .chip.on{background:var(--chip-on);}
.xray{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.xray input{width:90px;accent-color:var(--accent);}
.stats{position:absolute;top:12px;left:12px;font-size:13px;line-height:1.35;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);font-variant-numeric:tabular-nums;}
.stats b{font-size:16px;font-weight:800;font-stretch:115%;display:block;}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);max-width:min(560px,92vw);padding:0;}
dialog::backdrop{background:rgba(10,15,20,.5);}
.dlg{padding:18px 20px;}
.dlg h2{margin:0 0 6px;font-size:19px;font-stretch:115%;}
.dlg p{margin:0 0 10px;font-size:14px;color:var(--muted);}
.dlg textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px;}
.dlgbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}

.plansov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;}
.plansov[hidden]{display:none;}
.pbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:var(--panel);border-bottom:1px solid var(--line);}
.pbar b{font-size:17px;font-stretch:112%;}
.pbar span{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.pdoc{max-width:980px;margin:0 auto;padding:18px 16px 40px;}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.sheet h2{margin:0 0 10px;font-size:20px;font-stretch:115%;}
.eh{color:var(--text);font-size:15px;margin:18px 0 4px;}
.sm2{color:var(--muted);font-size:13px;margin:6px 0 0;max-width:72ch;}
.spec,.tbl{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px;}
.spec th{text-align:left;width:130px;color:var(--muted);font-weight:600;padding:5px 10px 5px 0;vertical-align:top;}
.spec td,.tbl td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line);}
.tblwrap{overflow-x:auto;}
.warnbox{margin-top:14px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--chip);font-size:13.5px;border-radius:4px;}
.dwg{width:100%;height:auto;display:block;margin-top:6px;}
.dwg text{font-family:"Archivo",system-ui,sans-serif;}
.dwg .wl{fill:var(--muted);fill-opacity:.35;stroke:var(--text);stroke-width:1;}
.dwg .fl{fill:var(--field);stroke:var(--text);stroke-width:1;}
.dwg .gap{fill:var(--field);stroke:none;}
.dwg .win{stroke:#2f7fbf;stroke-width:3;}
.dwg .roll{stroke:#2f7fbf;stroke-width:2.5;stroke-dasharray:6 3;}
.dwg .ln{stroke:var(--text);stroke-width:1.4;fill:none;}
.dwg .arc{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:3 3;}
.dwg .it{fill:#f2b705;fill-opacity:.12;stroke:var(--muted);stroke-dasharray:4 3;}
.dwg .code{fill:#2f7fbf;font-size:12px;font-weight:700;}
.dwg .lbl{fill:var(--text);font-size:13px;font-weight:600;}
.dwg .sm{fill:var(--muted);font-size:11px;}
.dwg .dim line{stroke:#b07d00;stroke-width:1;}
.dwg .dim text{fill:var(--text);font-size:12px;font-weight:600;}
.dwg .tm{fill:#ecd3a1;stroke:#8a6630;stroke-width:.7;}
.dwg .tm2{fill:#c9995a;stroke:#6f4f22;stroke-width:.7;}
.dwg .op{fill:#2f7fbf;fill-opacity:.07;stroke:#2f7fbf;stroke-width:1.2;stroke-dasharray:5 3;}
.dwg .ol{fill:none;stroke:var(--muted);stroke-width:1;}
.dwg .rf{fill:var(--muted);fill-opacity:.15;stroke:var(--text);stroke-width:1;}
.dwg .wd{fill:none;stroke:var(--text);stroke-width:1;stroke-dasharray:6 4;}
.dwg .raf{stroke:#8a6630;stroke-width:2;}
.dwg .bat{stroke:#c49a63;stroke-width:1;}
.dwg .rdg{stroke:var(--text);stroke-width:3;}
.dwg .hi{stroke:var(--bad);stroke-width:3;}
.dwg .jst{stroke:#c49a63;stroke-width:1.2;}
.dwg .bea{fill:#b8894a;stroke:#6f4f22;stroke-width:.6;}
.dwg .stp{fill:var(--text);}
.dwg .grd{stroke:var(--muted);stroke-width:.5;}
.dwg .gnd{stroke:var(--text);stroke-width:1.5;}
.dwg .rfs{fill:var(--muted);fill-opacity:.5;stroke:var(--text);stroke-width:1;}
.steps{padding-left:22px;margin:8px 0 0;}
.steps>li{margin:0 0 14px;}
.steps>li>b{font-size:15.5px;}
.steps ul{margin:4px 0 0;padding-left:18px;}
.steps ul li{margin:3px 0;font-size:14px;max-width:75ch;}
.incl{margin:4px 0 0;padding-left:18px;font-size:14px;}
.pick{position:absolute;top:70px;right:12px;width:320px;max-height:calc(100% - 140px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:5;}
.pick[hidden]{display:none;}
.pkh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pkh b{font-size:16px;font-stretch:110%;}
.pkh small{display:block;color:var(--muted);font-size:12.5px;}
.pkn{font-size:13px;color:var(--muted);margin:6px 0 2px;}
.pick h4{margin:12px 0 6px;font-size:13px;color:var(--muted);}
.pick .grid2 .inp input{width:100%;}
.pick select{max-width:170px;}
.pkrow{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:13px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;}
.pkrow small{grid-column:1 / -1;color:var(--muted);font-size:11.5px;}
.step{display:inline-flex;align-items:center;gap:6px;margin-left:8px;vertical-align:middle;}
.step button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:700;line-height:1;padding:0;}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;}
.parts{display:flex;flex-direction:column;gap:8px;}
.part{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;}
.part .pn a{display:block;font-size:11.5px;color:var(--muted);}
.pick .btns{margin-top:12px;}
.stats .hint{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}
@media (max-width:820px){.pick{top:auto;bottom:96px;left:8px;right:8px;width:auto;max-height:62%;}}
@media print{
  :root{--bg:#fff;--panel:#fff;--text:#000;--muted:#555;--line:#bbb;--field:#fff;--chip:#f2f2f2;padding:0;}
  html,body{height:auto;overflow:visible;background:#fff;}
  .app,.pbar,dialog{display:none!important;}
  .plansov{position:static;overflow:visible;}
  .pdoc{max-width:none;padding:0;}
  .sheet{border:0;padding:0;margin:0 0 8mm;}
  .sheet+.sheet{break-before:page;}
  .dwg{break-inside:avoid;}
}
@media (max-width:820px){
  body{overflow:hidden;}
  .app{grid-template-columns:1fr;grid-template-rows:52% 48%;}
  .stage{grid-row:1;}
  .panel{grid-row:2;border-right:0;border-top:1px solid var(--line);}
  .ph{padding:10px 14px 6px;}
  .ph p{display:none;}
  h1{font-size:19px;}
  .logo{width:30px;height:30px;}
  .tabbody{padding:2px 14px 24px;}
  .stats{font-size:12px;padding:6px 10px;}
  .stats b{font-size:14px;}
  .tbar.views{top:auto;bottom:52px;right:8px;left:8px;justify-content:flex-start;}
  .tbar.layers{bottom:8px;left:8px;right:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .tbar .chip{padding:5px 10px;font-size:12.5px;white-space:nowrap;}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}
</style>
</head>
<body>
<div class="app">
  <aside class="panel">

  trim:t=>t<0.14?200+45*Math.sin(Math.PI*t/0.14):238,
  board:t=>t>0.93?140:250-45*t,
  joint:t=>(t<0.006||t>0.994)?165:240,
  groove:t=>t<0.07?150:228
};
function profTex(name,rows){const N=256;const f=PROFILES[name]||PROFILES.corr;const c=document.createElement('canvas');c.width=rows?4:N;c.height=rows?N:4;const g=c.getContext('2d');for(let i=0;i<N;i++){const v=Math.round(Math.max(0,Math.min(255,f((i+0.5)/N))));g.fillStyle=`rgb(${v},${v},${v})`;if(rows)g.fillRect(0,i,4,1);else g.fillRect(i,0,1,4);}const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
const TEXC={};function tex(name,rows){const k=name+(rows?'r':'c');if(!TEXC[k])TEXC[k]=profTex(name,rows);const t=TEXC[k].clone();t.needsUpdate=true;return t;}
function paverTex2(pattern,pw,pl,gp,speck){
  const uW=pw+gp,uL=(pl+gp)*(pattern==='stretcher'?2:1);const cw=256,ch=Math.max(16,Math.min(1024,Math.round(256*uL/uW)));
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const g=c.getContext('2d');
  g.fillStyle='rgb(120,118,114)';g.fillRect(0,0,cw,ch);
  const sx=cw/uW,sz=ch/uL;const gx=gp>0?Math.max(1,gp*sx):0,gz=gp>0?Math.max(1,gp*sz):0;
  const pav=(x,y,w,h)=>{const v=225+Math.round((Math.random()-0.5)*26);g.fillStyle=`rgb(${v},${v},${v})`;g.fillRect(x,y,w,h);};
  if(pattern==='stretcher'){const rh=ch/2;pav(gx/2,gz/2,cw-gx,rh-gz);pav(-cw/2+gx/2,rh+gz/2,cw-gx,rh-gz);pav(cw/2+gx/2,rh+gz/2,cw-gx,rh-gz);}
  else pav(gx/2,gz/2,cw-gx,ch-gz);
  const N=Math.round(cw*ch*speck*0.15);for(let i=0;i<N;i++){const v=Math.random()<0.5?255:60;g.fillStyle=`rgba(${v},${v},${v},${0.15+Math.random()*0.2})`;g.fillRect(Math.random()*cw,Math.random()*ch,1+Math.random()*2,1+Math.random()*2);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function gravelTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='rgb(215,215,215)';g.fillRect(0,0,128,128);
  for(let i=0;i<900;i++){const v=150+Math.round(Math.random()*105);g.fillStyle=`rgb(${v},${v},${v})`;g.beginPath();g.arc(Math.random()*128,Math.random()*128,1+Math.random()*2.5,0,Math.PI*2);g.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}
function floorSurfMat(D){const S=plan.shed;if(S.floorSheet==='deck'){const t=tex('groove',false);t.repeat.set(D.W/0.095,1);const m=new THREE.MeshStandardMaterial({color:0x9a6a43,map:t,roughness:0.8});m.userData.ownMap=true;return m;}return new THREE.MeshStandardMaterial({color:S.floorSheet==='ply'?0xdcbf8f:0xd8b77c,roughness:0.8});}
function paverTex(){const c=document.createElement('canvas');c.width=c.height=64;const g=c.getContext('2d');g.fillStyle='rgb(228,228,228)';g.fillRect(0,0,64,64);g.fillStyle='rgb(150,150,150)';g.fillRect(0,0,64,2);g.fillRect(0,0,2,64);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;}

function clearGroup(g){
  g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material){const ms=Array.isArray(o.material)?o.material:[o.material];ms.forEach(m=>{if(m.map&&m.userData.ownMap)m.map.dispose();m.dispose();});}});
  while(g.children.length)g.remove(g.children[0]);
}
let lastMesh=null,curWall=null,lastElev={},lastRoof=null;
function addBox(g,x,y,z,sx,sy,sz,mat,shadow=true){
  const m=new THREE.Mesh(new THREE.BoxGeometry(Math.max(sx,0.001),Math.max(sy,0.001),Math.max(sz,0.001)),mat);
  m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;g.add(m);lastMesh=m;return m;
}
function matGroup(parent,mtx){const g=new THREE.Group();mtx.decompose(g.position,g.quaternion,g.scale);parent.add(g);return g;}
function wallGroup(parent,wd){return matGroup(parent,new THREE.Matrix4().makeBasis(v3(wd.dir[0],0,wd.dir[1]),v3(0,1,0),v3(wd.n[0],0,wd.n[1])).setPosition(wd.o[0],0,wd.o[1]));}

let M=null;
function makeMats(D){
  const S=plan.shed;const op=plan.xray;const tr=op<0.999;
  const WM=WALL_MATS[S.wallMat]||WALL_MATS.corr,RM=ROOF_MATS[S.roofMat]||ROOF_MATS.corr;
  const wallTex=tex(WM.tex,WM.dir==='row');if(WM.dir==='row')wallTex.repeat.set(1,1/WM.pitch);else wallTex.repeat.set(1/WM.pitch,1);
  const Lz=D.L+2*Math.min(D.o,0.15);
  const roofTex=tex(RM.tex,true);roofTex.repeat.set(1,Lz/RM.pitch);
  const sheetMat=(col,map,matte,clear)=>{const o2=clear?Math.min(op,0.5):op,t2=!!clear||tr;const m=new THREE.MeshStandardMaterial({color:col,map,roughness:matte?0.85:(clear?0.15:0.55),metalness:matte?0:0.18,side:THREE.DoubleSide,transparent:t2,opacity:o2,depthWrite:!t2});m.userData.ownMap=true;m.userData.xray=!clear;return m;};
  const plain=(col,x)=>{const m=new THREE.MeshStandardMaterial({color:col,roughness:0.6,metalness:0.15,transparent:x&&tr,opacity:x?op:1,depthWrite:!(x&&tr)});m.userData.xray=!!x;return m;};
  return {
    timber:new THREE.MeshStandardMaterial({color:0xd2ac6e,roughness:0.85}),
    clad:sheetMat(WM.natural||COLORBOND[S.wallColor]||'#E4E2D5',wallTex,WM.kind!=='sheet'),
    roof:sheetMat(RM.color||COLORBOND[S.roofColor]||'#323233',roofTex,false,RM.clear),
    trim:plain(COLORBOND[S.wallColor]||'#E4E2D5',true),
    trimRoof:plain(COLORBOND[S.roofColor]||'#323233',true),
    door:new THREE.MeshStandardMaterial({color:COLORBOND[S.doorColor]||'#323233',roughness:0.5,metalness:0.2}),
    doorCol:COLORBOND[S.doorColor]||'#323233',
    glass:new THREE.MeshStandardMaterial({color:0x9fc7e0,transparent:true,opacity:0.42,roughness:0.08,metalness:0.1,depthWrite:false}),
    alum:new THREE.MeshStandardMaterial({color:0xc4c9cc,roughness:0.35,metalness:0.6}),
    slab:new THREE.MeshStandardMaterial({color:0xbdb9b1,roughness:0.95})
  };
}

/* ---------- build ---------- */
let lastPieces=[],lastWallSheets=[],lastRoofSheets=[],lastFlash=[],lastAreas={wall:0,roof:0},labelData=[];
function rebuildShed(){
  ['slab','frame','clad','roof','openings','dims'].forEach(k=>clearGroup(L[k]));clearGroup(ctxRoot);lastPosts=[];
  const D=dims(),S=plan.shed;M=makeMats(D);shedRoot.rotation.y=rootAngle()*Math.PI/180;shedRoot.updateMatrixWorld(true);
  clearPickHelper();curWall=null;lastElev={};const pieces=[];const P=(cat,size,len)=>{if(lastMesh&&!lastMesh.userData.part)lastMesh.userData.part={type:'timber',cat,size,len,wall:curWall};if(len>0.02)pieces.push({cat,size,len});};
  const flash=[];const wallSheets=[];let wallArea=0;
  shedRoot.position.y=floorLift();L.items.position.y=floorLift();buildFloor(D,P);
  const WD=wallDefs(D);
  if(isEnclosed())Object.entries(WD).forEach(([key,wd])=>{
    const ops=resolveOps(D,wd,worldKeyOf(key));
    curWall=worldKeyOf(key);buildFrame(D,wd,key,ops,P);curWall=null;
    buildClad(D,wd,key,ops);
    buildOpenings(wd,ops);
    const bps=bpsRange(D,wd,key,0,wd.len);
    for(let i=0;i<bps.length-1;i++)wallArea+=(bps[i+1]-bps[i])*(hAt(D,wd,bps[i])+hAt(D,wd,bps[i+1]))/2;
    ops.forEach(o=>wallArea-=o.w*o.h);
    const n=Math.ceil(wd.len/SHEET-1e-6);
    for(let i=0;i<n;i++){const sa=i*SHEET,sb=Math.min(wd.len,(i+1)*SHEET);let mh=Math.max(hAt(D,wd,sa),hAt(D,wd,sb));bps.forEach(b=>{if(b>sa&&b<sb)mh=Math.max(mh,hAt(D,wd,b));});wallSheets.push(mh);}
  });
  if(!isEnclosed()&&stype()!=='deck')buildPosts(D,P);if(stype()==='deck')buildBalustrade(D,P);buildInner(D,P);
  if(isEnclosed())[[-D.W/2,D.L/2],[D.W/2,D.L/2],[D.W/2,-D.L/2],[-D.W/2,-D.L/2]].forEach(([x,z])=>{const h=topHeight(D,x);addBox(L.clad,x,h/2,z,0.06,h,0.06,M.trim);flash.push([(WALL_MATS[S.wallMat]||WALL_MATS.corr).kind==='sheet'?'Corner flashing':'Corner trim',h]);});

  rebuildServices();applyLayers();updateStats();
}

function buildFloor(D,P){
  const S=plan.shed,f=S.floor;
  if(f==='slab'){const T=S.slabT/1000;addBox(L.slab,0,-T/2,0,D.W+0.1,T,D.L+0.1,M.slab,false);}
  else if(f==='pavers'){const PT=PAVER_TYPES[S.paverType]||PAVER_TYPES.concrete;const pw=Math.max(0.03,S.paverW/1000),pl=Math.max(0.03,S.paverL/1000),gp=Math.max(0,S.paverGap/1000);const t=paverTex2(S.paverPattern,pw,pl,gp,PT.speck);const uW=pw+gp,uL=(pl+gp)*(S.paverPattern==='stretcher'?2:1);t.repeat.set(D.W/uW,D.L/uL);const m=new THREE.MeshStandardMaterial({color:new THREE.Color(S.paverColor||PT.col),map:t,roughness:0.9});m.userData.ownMap=true;const pt=PT.t/1000;addBox(L.slab,0,-pt/2,0,D.W,pt,D.L,m,false);}
  else if(f==='gravel'){const t=gravelTex();t.repeat.set(D.W/0.6,D.L/0.6);const m=new THREE.MeshStandardMaterial({color:(GRAVEL_TYPES[S.gravelType]||GRAVEL_TYPES.crushed).col,map:t,roughness:1});m.userData.ownMap=true;addBox(L.slab,0,-0.03,0,D.W+0.1,0.06,D.L+0.1,m,false);}
  else if(f==='timber'){
    const lift=floorLift(),ft=0.019,jd=0.09,jt=0.045,bd=0.14,bt=0.045;
    addBox(L.slab,0,-ft/2,0,D.W,ft,D.L,floorSurfMat(D));
    const nb=Math.max(2,Math.ceil((D.W-0.1)/1.8)+1);const bx=i=>-D.W/2+0.05+i*(D.W-0.1)/(nb-1);
    const ns=Math.max(2,Math.ceil(D.L/1.8)+1);const sh=lift+0.06-(ft+jd+bd);
    for(let i=0;i<nb;i++){
      addBox(L.slab,bx(i),-ft-jd-bd/2,0,bt*2,bd,D.L,M.timber);P('Bearers (doubled)','140x45',D.L);P('Bearers (doubled)','140x45',D.L);
      for(let j=0;j<ns;j++){const z=-D.L/2+0.1+j*(D.L-0.2)/(ns-1);addBox(L.slab,bx(i),-ft-jd-bd-sh/2,z,0.09,sh,0.09,M.timber);P('Stumps','90x90',sh+0.45);}
    }
    const nj=Math.ceil((D.L-jt)/((plan.shed.joistSpacing||450)/1000));for(let j=0;j<=nj;j++){const z=-D.L/2+jt/2+j*(D.L-jt)/nj;addBox(L.slab,0,-ft-jd/2,z,D.W,jd,jt,M.timber);P('Floor joists','90x45',D.W);}
  }
}

function buildFrame(D,wd,key,ops,P){
  const size=plan.shed.studSize;const g=wallGroup(L.frame,wd);const d=D.d,t=D.t,n=-d/2;
  const el={len:wd.len,ops,members:[],prof:bpsRange(D,wd,key,0,wd.len).map(s=>[s,hAt(D,wd,s)])};lastElev[worldKeyOf(key)]=el;
  const box=(s,y,sx,sy)=>{const m=addBox(g,s,y,n,sx,sy,d,M.timber);el.members.push({s,y,sx,sy,m});return m;};
  let segs=[[wd.s0,wd.s1]];
  ops.filter(o=>o.door).forEach(o=>{segs=segs.flatMap(([x,y])=>(o.b<=x||o.a>=y)?[[x,y]]:[[x,Math.max(x,o.a)],[Math.min(y,o.b),y]].filter(q=>q[1]-q[0]>0.02));});
  segs.forEach(([x,y])=>{box((x+y)/2,t/2,y-x,t);P('Bottom plate',size,y-x);});
  const bps=bpsRange(D,wd,key,wd.s0,wd.s1);
  for(let i=0;i<bps.length-1;i++){
    const sa=bps[i],sb=bps[i+1],ha=hAt(D,wd,sa),hb=hAt(D,wd,sb);const ang=Math.atan2(hb-ha,sb-sa),len=Math.hypot(sb-sa,hb-ha);
    const m=box((sa+sb)/2+Math.sin(ang)*t/2,(ha+hb)/2-Math.cos(ang)*t/2,len,t);m.rotation.z=ang;P('Top plate',size,len);
  }
  const topY=s=>{const e=0.001;const sl=(hAt(D,wd,s+e)-hAt(D,wd,s-e))/(2*e);return hAt(D,wd,s)-t*Math.sqrt(1+sl*sl);};
  const sp=plan.shed.studSpacing/1000;
  const gridS=[];for(let s=wd.s0;s<wd.s1-t-0.001;s+=sp)gridS.push(s);gridS.push(wd.s1-t);
  const members=[];
  const stud=(s,yb,yt,cat)=>{const len=yt-yb;if(len<0.03)return;box(s+t/2,yb+len/2,t,len);P(cat||'Studs',size,len);};
  gridS.forEach(s=>{if(ops.some(o=>s+t>o.a-t-0.001&&s<o.b+t+0.001))return;stud(s,t,topY(s+t/2));members.push(s);});
  ops.forEach(o=>{
    [o.a-t,o.b].forEach(s=>{if(s<wd.s0-0.001||s>wd.s1-t+0.001)return;stud(s,t,topY(s+t/2));members.push(s);});
    const Y1=o.sill+o.h;const room=Math.min(topY(Math.max(o.a,wd.s0)),topY(Math.min(o.b,wd.s1)))-Y1;
    const LH=[0.19,0.14,0.09,0.07].find(x=>x<=room-0.005)||0;
    if(LH>0){box((o.a+o.b)/2,Y1+LH/2,o.b-o.a,LH);P('Lintels',Math.round(LH*1000)+'x'+Math.round(t*1000),o.b-o.a);}
    gridS.forEach(s=>{if(s>o.a+0.01&&s+t<o.b-0.01)stud(s,Y1+LH,topY(s+t/2));});
    if(!o.door&&o.sill>t+0.05){box((o.a+o.b)/2,o.sill-t/2,o.b-o.a,t);P('Sill trimmers',size,o.b-o.a);gridS.forEach(s=>{if(s>o.a+0.01&&s+t<o.b-0.01)stud(s,t,o.sill-t);});}
  });
  const yN=Math.min(1.2,D.H/2);members.sort((a,b)=>a-b);
  for(let i=0;i<members.length-1;i++){
    const x0=members[i]+t,x1=members[i+1];const gap=x1-x0;if(gap<0.03)continue;const mid=(x0+x1)/2;
    if(yN>topY(mid)-t)continue;
    if(ops.some(o=>mid>o.a-t&&mid<o.b+t&&yN>o.sill-t-0.05&&yN<o.sill+o.h+0.2))continue;
    box(mid,yN,gap,t);P('Noggings',size,gap);
  }
}

function buildClad(D,wd,key,ops){
  const g=wallGroup(L.clad,wd);const bps=bpsRange(D,wd,key,0,wd.len);
  const sh=new THREE.Shape();sh.moveTo(0,0);sh.lineTo(wd.len,0);
  for(let i=bps.length-1;i>=0;i--)sh.lineTo(bps[i],hAt(D,wd,bps[i]));
  sh.closePath();
  ops.forEach(o=>{
    const a=Math.max(0.01,o.a),b=Math.min(wd.len-0.01,o.b);const y0=Math.max(0.004,o.sill);
    const y1=Math.min(o.sill+o.h,Math.min(hAt(D,wd,a),hAt(D,wd,b))-0.01);
    if(b-a<0.02||y1-y0<0.02)return;
    const hp=new THREE.Path();hp.moveTo(a,y0);hp.lineTo(b,y0);hp.lineTo(b,y1);hp.lineTo(a,y1);hp.closePath();sh.holes.push(hp);
  });
  const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),M.clad);m.userData.part={type:'clad',wall:worldKeyOf(key)};m.position.z=0.004;m.castShadow=true;m.receiveShadow=true;g.add(m);
}

function buildOpenings(wd,ops){
  const g=wallGroup(L.openings,wd);
  ops.forEach(o=>{const n0=g.children.length;buildOneOpening(g,o);for(let i=n0;i<g.children.length;i++)g.children[i].userData.part={type:'opening',id:o.id};});
}
function buildOneOpening(g,o){
  const w=o.b-o.a,c=(o.a+o.b)/2;const src=plan.openings.find(x=>x.id===o.id)||{};const bl=OPEN_BUILDS[o.type]||[];const bld=src.build||(bl[0]&&bl[0].id);
  const texMat=(name,rep,col,rough)=>{const t=tex(name,false);t.repeat.set(rep,1);const m=new THREE.MeshStandardMaterial({color:col,map:t,roughness:rough});m.userData.ownMap=true;return m;};
  if(o.type==='roller'){
    const t2=RIB_H.clone();t2.needsUpdate=true;t2.repeat.set(1,o.h/0.07);
    const mat=new THREE.MeshStandardMaterial({color:M.doorCol,map:t2,roughness:0.5,metalness:0.2});mat.userData.ownMap=true;
    addBox(g,c,o.h/2,-0.03,w,o.h,0.02,mat);
  }else if(o.type==='pa'){
    const mat=bld==='ledge'?texMat('groove',w/0.14,0xc49a63,0.85):bld==='colorbond'?texMat('corr',w/0.076,M.doorCol,0.5):M.door;
    addBox(g,c,o.h/2,-0.025,w,o.h,0.035,mat);
    const hd=new THREE.Mesh(new THREE.SphereGeometry(0.03,12,8),M.alum);hd.position.set(c+w/2-0.09,1.0,0);g.add(hd);
  }else if(o.type==='window'){
    if(bld==='poly')addBox(g,c,o.sill+o.h/2,-0.02,w,o.h,0.006,new THREE.MeshStandardMaterial({color:0xf3f5f6,transparent:true,opacity:0.78,roughness:0.4,depthWrite:false}),false);
    else addBox(g,c,o.sill+o.h/2,-0.02,w,o.h,0.006,M.glass,false);
    const fz=-0.015,ft=0.04,fr=bld==='poly'?M.timber:M.alum;
    addBox(g,c,o.sill+ft/2,fz,w,ft,0.05,fr);addBox(g,c,o.sill+o.h-ft/2,fz,w,ft,0.05,fr);
    addBox(g,o.a+ft/2,o.sill+o.h/2,fz,ft,o.h,0.05,fr);addBox(g,o.b-ft/2,o.sill+o.h/2,fz,ft,o.h,0.05,fr);
    if(bld==='louvre'){const n=Math.max(3,Math.round(o.h/0.1));for(let i=0;i<n;i++){const sl=addBox(g,c,o.sill+ft+(i+0.5)*(o.h-2*ft)/n,-0.02,w-2*ft,0.006,0.08,M.glass,false);sl.rotation.x=0.5;}}
    else if(w>0.9&&bld!=='poly')addBox(g,c,o.sill+o.h/2,fz,ft*0.75,o.h,0.05,fr);
  }
}

function buildRoof(D,P,flash,roofSheets){
  const S=plan.shed;const {W,H,o,tp,c,sn,rd,rt}=D;const Lz=D.L+2*Math.min(o,0.15);const openRoof=S.roofMat==='none';
  const slopes=D.roof==='gable'
    ?[{P:[-W/2-o,H-o*tp],sx:1,sv:1,len:(W/2+o)/c},{P:[W/2+o,H-o*tp],sx:-1,sv:1,len:(W/2+o)/c}]
    :[{P:[-W/2-o,H+(W+o)*tp],sx:1,sv:-1,len:(W+2*o)/c}];
  const rs=S.rafterSpacing/1000,bs=S.battenSpacing/1000;
  const nR=Math.max(1,Math.ceil((D.L-rt)/rs));const zs=[];for(let i=0;i<=nR;i++)zs.push(-D.L/2+rt/2+i*(D.L-rt)/nR);
  const sheetH=rd+0.035;let area=0;
  slopes.forEach(sl=>{
    const sd=v3(c*sl.sx,sn*sl.sv,0);const ny=v3(-sd.y,sd.x,0);if(ny.y<0)ny.negate();const nz=sd.clone().cross(ny);
    const mtx=new THREE.Matrix4().makeBasis(sd,ny,nz).setPosition(sl.P[0],sl.P[1],0);

/* ---------- tabs ---------- */
function switchTab(name){
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.tab===name));
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='tab-'+name));
  if(name==='materials')renderMaterials();
  if(name==='items'){renderItemList();renderItemEditor();}
  if(name==='trades')renderTradesTab();
}
$('.tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(b)switchTab(b.dataset.tab);});

/* ---------- save / load ---------- */
const dlg=$('#fileDlg');let resetArmed=0;
$('#btnFile').addEventListener('click',()=>{$('#planJson').value=JSON.stringify(Object.assign({},plan,{selected:null}));$('#dlgMsg').textContent='';resetArmed=0;$('#resetPlan').textContent='Start a new plan';dlg.showModal();});
$('#copyJson').addEventListener('click',async()=>{const ta=$('#planJson');const ok=await copyText(ta.value,ta);$('#dlgMsg').textContent=ok?'Plan code copied.':'Select the code above and copy it manually.';});
$('#loadJson').addEventListener('click',()=>{
  try{const p=JSON.parse($('#planJson').value);if(!p||!p.shed)throw new Error();plan=migrate(p);plan.selected=null;refreshAll();save();$('#dlgMsg').textContent='Plan loaded.';}
  catch(e){$('#dlgMsg').textContent='That code isn’t a valid plan. Paste the full code copied from this tool.';}
});
$('#resetPlan').addEventListener('click',()=>{
  if(Date.now()-resetArmed>4000){resetArmed=Date.now();$('#resetPlan').textContent='Tap again to clear this plan';return;}
  plan=defaultPlan();refreshAll();save();$('#planJson').value=JSON.stringify(plan);$('#resetPlan').textContent='Start a new plan';resetArmed=0;$('#dlgMsg').textContent='New plan started.';
});

function refreshAll(){closePick();renderPlansTab();renderShedTab();renderOpeningsTab();renderItemsTab();renderLayerBar();rebuildShed();rebuildItems();renderTradesTab();if($('#tab-materials').classList.contains('on'))renderMaterials();setView('3d');}

/* ---------- tap to edit ---------- */
let pickState=null,pickHelper=null;
function clearPickHelper(){if(pickHelper){scene.remove(pickHelper);pickHelper.geometry.dispose();pickHelper.material.dispose();pickHelper=null;}}
function closePick(){pickState=null;clearPickHelper();const el=$('#pick');if(el){el.hidden=true;el.innerHTML='';}}
function pickAt(e){
  setPtr(e);ray.setFromCamera(ptr,camera);
  const ks=['openings','frame','clad','roof','slab'].filter(k=>plan.layers[k]&&!((k==='clad'||k==='roof')&&plan.xray<0.6));
  const hits=ray.intersectObjects(ks.map(k=>L[k]),true).filter(h=>h.object.userData.part);
  if(!hits.length)return false;
  const m=hits[0].object;pickState=Object.assign({},m.userData.part);
  clearPickHelper();pickHelper=new THREE.BoxHelper(m,0x2fb6ff);scene.add(pickHelper);
  renderPick();return true;
}
function pkSel(k,label){
  const S=plan.shed;const f=SHED_FIELDS.find(x=>x.k===k);if(!f)return '';
  const opts=f.type==='color'?Object.keys(COLORBOND):(typeof f.opts==='function'?f.opts():f.opts);
  return `<label class="row"><span>${esc(label||f.label)}</span><select data-pks="${k}">${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${String(S[k])===String(v)?'selected':''}>${esc(l)}</option>`;}).join('')}</select></label>`;
}
function pkNum(k,label,unit){const f=SHED_FIELDS.find(x=>x.k===k);const v=f.cm?plan.shed[k]/10:plan.shed[k];return `<label class="row"><span>${label}</span><span class="inp"><input type="number" data-pkn="${k}" value="${v}" step="${f.step}" inputmode="decimal"><em>${unit}</em></span></label>`;}
function pkOp(l,f,v,step){return `<label>${l}<span class="inp"><input type="number" data-po="${f}" value="${v/10}" step="${step}" inputmode="decimal"><em>cm</em></span></label>`;}
function pkRow(key){
  const r=computeMaterials().find(x=>x.key===key);if(!r)return '';
  return `<div class="pkrow"><small>In your materials list${r.exLab?', adjust extra '+esc(r.exLab):''}</small><div>${esc(r.order)}</div><span class="step"><button data-ex="${esc(r.key)}" data-d="-1" aria-label="Fewer">−</button><b>${r.extra>0?'+'+r.extra:r.extra}</b><button data-ex="${esc(r.key)}" data-d="1" aria-label="More">+</button></span></div>`;
}
function renderPick(){
  const el=$('#pick');if(!el)return;const p=pickState;if(!p){el.hidden=true;return;}
  const S=plan.shed;let h='';
  const head=(t,sub)=>`<div class="pkh"><div><b>${esc(t)}</b>${sub?`<small>${esc(sub)}</small>`:''}</div><button class="x" data-pk="close" aria-label="Close">✕</button></div>`;
  if(p.type==='timber'){
    const same=lastPieces.filter(x=>x.cat===p.cat&&x.size===p.size).length;
    h+=head(p.cat,`${p.size} timber, ${Math.round(p.len*100)} cm long${p.wall?', '+WALLS[p.wall]+' wall':''}`);
    h+=`<p class="pkn">${same} ${same===1?'piece':'pieces'} like this across the shed.</p>`;
    if(['Bottom plate','Top plate','Studs','Noggings','Sill trimmers'].includes(p.cat))h+=pkSel('studSize','Wall frame size')+pkSel('studSpacing');
    else if(p.cat==='Rafters'||p.cat==='Ridge board')h+=pkSel('rafterSize')+pkSel('rafterSpacing');
    else if(p.cat==='Roof battens')h+=pkSel('battenSpacing');
    else if(p.cat==='Lintels')h+=`<p class="pkn">Lintel size is picked automatically to fit the space above the opening.</p>`;
    else if(['Posts','Beams','Ledger'].includes(p.cat))h+=pkSel('postSize')+pkSel('postSpacing')+pkSel('beamSize');
    else if(/^Balust/.test(p.cat))h+=pkSel('balustrade')+pkSel('balSides');
    else h+=pkSel('floor');
    h+=pkRow('t:'+p.cat+':'+p.size);
  }else if(p.type==='clad'){
    const WM=WALL_MATS[S.wallMat]||WALL_MATS.corr;
    h+=head(WM.n,p.wall?WALLS[p.wall]+' wall':'Corner trim');
    h+=pkSel('wallMat','Wall material');if(S.wallMat!=='ply')h+=pkSel('wallColor','Colour');
    h+=pkRow('s:wall:'+S.wallMat);
    if(p.wall)h+=`<h4>Add to this wall</h4><div class="addrow" style="margin-top:0">${Object.entries(OPEN_TYPES).map(([k,v])=>`<button class="chip" data-pkadd="${k}">+ ${v.label}</button>`).join('')}</div>`;
  }else if(p.type==='roof'){
    const RM=ROOF_MATS[S.roofMat]||ROOF_MATS.corr;
    h+=head('Roof',RM.n);h+=pkSel('roofMat','Roof material');if(!RM.color)h+=pkSel('roofColor','Colour');
    h+=pkSel('roof')+pkSel('roofDir');if(S.roof!=='flat')h+=pkNum('pitch','Pitch','°');
    h+=pkRow('s:roof:'+S.roofMat);
  }else if(p.type==='floor'){
    h+=head(FLOORS[S.floor],floorDesc());h+=pkSel('floor');
    h+=SHED_FIELDS.filter(f=>f.show&&f.show(S.floor)&&f.type!=='note').map(f=>f.type==='num'?pkNum(f.k,f.label,f.unit):f.type==='sel'?pkSel(f.k):f.type==='hex'?`<label class="row"><span>${f.label}</span><input type="color" data-pkh="${f.k}" value="${esc(S[f.k])}"></label>`:'').join('');
    const fk={slab:'c:concrete',timber:'fl:'+S.floorSheet,pavers:'fl:pav:'+S.paverType+':'+S.paverW+'x'+S.paverL,gravel:'fl:gravel:'+S.gravelType}[S.floor];if(fk)h+=pkRow(fk);
  }else if(p.type==='opening'){
    const o=plan.openings.find(x=>x.id===p.id);if(!o){closePick();return;}
    const builds=OPEN_BUILDS[o.type];const b=o.build||builds[0].id;
    h+=head(OPEN_TYPES[o.type].label,`${WALLS[o.wall]} wall, ${o.width/10} × ${o.height/10} cm`);
    h+=`<label class="row"><span>Type</span><select data-po="type">${Object.entries(OPEN_TYPES).map(([k,v])=>`<option value="${k}" ${k===o.type?'selected':''}>${v.label}</option>`).join('')}</select></label>`;
    if(builds.length>1)h+=`<label class="row"><span>Made from</span><select data-po="build">${builds.map(x=>`<option value="${x.id}" ${x.id===b?'selected':''}>${x.n}</option>`).join('')}</select></label>`;
    h+=`<div class="grid2">${pkOp('Width','width',o.width,1)}${pkOp('Height','height',o.height,1)}${pkOp('Offset from centre','offset',o.offset,5)}${o.type==='window'?pkOp('Sill height','sill',o.sill,5):''}</div>`;
    const parts=openingParts(o);
    if(parts.length){h+=`<h4>What it’s made of</h4><div class="parts">`+parts.map(pt=>`<div class="part"><input type="checkbox" data-pp="${pt.id}" ${pt.on?'checked':''} aria-label="Include ${esc(pt.n)}"><span class="pn">${esc(pt.n)}</span><span class="inp sm"><input type="number" data-pq="${pt.id}" value="${pt.qty}" min="0" step="${pt.unit==='m'?0.1:1}" aria-label="Quantity"><em>${pt.unit}</em></span></div>`).join('')+'</div><p class="pkn">Untick anything you already have. Quantities flow into the Materials tab.</p>';}
    const iss=openingIssue(o);if(iss)h+=`<p class="warn">${esc(iss)}</p>`;
    h+=`<div class="btns"><button class="btn danger" data-pk="delop">Remove this ${OPEN_TYPES[o.type].label.toLowerCase()}</button></div>`;
  }
  el.innerHTML=h;el.hidden=false;
}
function bumpExtra(k,d){plan.extra=plan.extra||{};plan.extra[k]=(+plan.extra[k]||0)+d;if(!plan.extra[k])delete plan.extra[k];save();if($('#tab-materials').classList.contains('on'))renderMaterials();renderPick();}
$('#pick').addEventListener('click',e=>{
  const c=e.target.closest('[data-pk]');
  if(c){if(c.dataset.pk==='close')closePick();else if(c.dataset.pk==='delop'&&pickState){plan.openings=plan.openings.filter(o=>o.id!==pickState.id);closePick();afterOpenings(true);}return;}
  const ex=e.target.closest('[data-ex]');if(ex){bumpExtra(ex.dataset.ex,+ex.dataset.d);return;}
  const ad=e.target.closest('[data-pkadd]');
  if(ad&&pickState&&pickState.wall){const k=ad.dataset.pkadd,t=OPEN_TYPES[k];const o={id:uid(),type:k,wall:pickState.wall,offset:0,width:t.w,height:t.h,sill:t.sill,build:OPEN_BUILDS[k][0].id,parts:{}};plan.openings.push(o);pickState={type:'opening',id:o.id};afterOpenings(true);}
});
$('#pick').addEventListener('change',e=>{
  const t=e.target,S=plan.shed;
  if(t.dataset.pks){const k=t.dataset.pks;let v=t.value;if(typeof S[k]==='number')v=Number(v);S[k]=v;shedSideFx(k,v);if(pickState&&pickState.type==='timber'&&(k==='studSize'||k==='rafterSize'))pickState.size=v;renderShedTab();onShedChanged();return;}
  if(t.dataset.pkh){S[t.dataset.pkh]=t.value;renderShedTab();onShedChanged();return;}
  if(t.dataset.pkn){const k=t.dataset.pkn;const f=SHED_FIELDS.find(x=>x.k===k);let v=parseFloat(t.value);if(!isFinite(v))return;v=Math.min(f.max,Math.max(f.min,v));S[k]=f.cm?Math.round(v*10):v;renderShedTab();onShedChanged();return;}
  const o=pickState&&plan.openings.find(x=>x.id===pickState.id);if(!o)return;
  if(t.dataset.po){const f=t.dataset.po;if(f==='type'){o.type=t.value;const d=OPEN_TYPES[o.type];o.width=d.w;o.height=d.h;o.sill=d.sill;o.build=OPEN_BUILDS[o.type][0].id;o.parts={};}else if(f==='build'){o.build=t.value;o.parts={};}else{const v=parseFloat(t.value);if(!isFinite(v))return;o[f]=Math.round(v*10);}afterOpenings(true);return;}
  o.parts=o.parts||{};
  if(t.dataset.pp){const st=o.parts[t.dataset.pp]=o.parts[t.dataset.pp]||{};st.on=t.checked;scheduleMaterials();save();return;}
  if(t.dataset.pq){const st=o.parts[t.dataset.pq]=o.parts[t.dataset.pq]||{};const v=parseFloat(t.value);st.q=isFinite(v)?Math.max(0,v):null;scheduleMaterials();save();return;}
});

function renderPlansTab(){
  $('#tab-plans').innerHTML=`<h3>Plans and build guide</h3><p class="note" style="margin-top:0">Drawings and step-by-step instructions generated from your current design. They update whenever you change the shed.</p>
  <button class="primary" id="openPlans" style="margin-top:12px">Open plans and build guide</button>
  <h3>What’s included</h3><ul class="incl"><li>Floor plan with doors, windows and items</li><li>Slab or floor framing plan</li><li>Framing elevation for every wall</li><li>Roof framing plan and section</li><li>Door and window schedule</li><li>Cut list for all framing</li><li>Build guide in order, from set-out to finishing</li><li>Services layout and takeoff for each trade you add</li></ul>
  <p class="note">These are guide drawings made from the model, not engineered plans. Council or a certifier may ask for engineering if a permit is needed.</p>`;
}
$('#tab-plans').addEventListener('click',e=>{if(e.target.id==='openPlans')openPlans();});
function openPlans(){$('#plansDoc').innerHTML=plansHTML();const ov=$('#plansOv');ov.hidden=false;ov.scrollTop=0;}
$('#closePlans').addEventListener('click',()=>{$('#plansOv').hidden=true;});
$('#printPlans').addEventListener('click',()=>{try{window.print();}catch(e){}});

function svgWrap(w,h,inner){return `<div class="tblwrap"><svg viewBox="0 0 ${Math.round(w)} ${Math.round(h)}" class="dwg" role="img" style="max-width:${Math.round(w*1.15)}px;margin:6px auto 0">${inner}</svg></div>`;}
function dimH(x1,x2,y,label,tk=6){if(Math.abs(x2-x1)<1)return '';return `<g class="dim"><line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}"/><line x1="${x1}" y1="${y-tk}" x2="${x1}" y2="${y+tk}"/><line x1="${x2}" y1="${y-tk}" x2="${x2}" y2="${y+tk}"/><text x="${(x1+x2)/2}" y="${y-5}" text-anchor="middle">${label}</text></g>`;}
function dimV(x,y1,y2,label,tk=6){if(Math.abs(y2-y1)<1)return '';const ym=(y1+y2)/2;return `<g class="dim"><line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}"/><line x1="${x-tk}" y1="${y1}" x2="${x+tk}" y2="${y1}"/><line x1="${x-tk}" y1="${y2}" x2="${x+tk}" y2="${y2}"/><text x="${x-6}" y="${ym}" text-anchor="middle" transform="rotate(-90 ${x-6} ${ym})">${label}</text></g>`;}
function rotWrap(hx,hz){const a=rootAngle(),sw=a%180!==0;const wx=sw?hz:hx,wz=sw?hx:hz;const sc=Math.min(320/wx,210/wz);const m=70;const vw=2*wx*sc+2*m,vh=2*wz*sc+2*m+10;const cx=vw/2,cy=m+wz*sc;
  return {sc,vw,vh,cx,cy,wx,wz,open:`<g transform="translate(${cx} ${cy}) rotate(${-a})">`,close:'</g>',front:`<text x="${cx}" y="${vh-14}" text-anchor="middle" class="lbl">Front</text>`};}
function dims2(R,a,b){return dimH(R.cx-R.wx*R.sc,R.cx+R.wx*R.sc,R.cy+R.wz*R.sc+30,a)+dimV(R.cx+R.wx*R.sc+30,R.cy-R.wz*R.sc,R.cy+R.wz*R.sc,b);}
function worldWalls(){const S=plan.shed;return wallDefs({W:S.width/1000,L:S.length/1000,d:dims().d});}
function openingCodes(){const pre={roller:'R',pa:'D',window:'W',opening:'B'};const n={},m={};plan.openings.forEach(o=>{const p=pre[o.type]||'O';n[p]=(n[p]||0)+1;m[o.id]=p+n[p];});return m;}
function buildName(o){const bl=OPEN_BUILDS[o.type];return (bl.find(x=>x.id===o.build)||bl[0]).n;}

function plansHTML(){
  const S=plan.shed,D=dims();const WM=WALL_MATS[S.wallMat]||WALL_MATS.corr,RM=ROOF_MATS[S.roofMat]||ROOF_MATS.corr;
  const codes=openingCodes();const dirOpt=(SHED_FIELDS.find(f=>f.k==='roofDir').opts().find(o=>o[0]==rootAngle())||[0,''])[1];
  const tb=[META.planName,META.clientName,META.siteAddress].filter(Boolean).map(esc).join(' · ');
  let h=`<section class="sheet"><h2>${META.planName?esc(META.planName):'Build plans'}</h2>${META.businessName?`<p class="sm2"><b>${esc(META.businessName)}</b>${META.businessContact?' · '+esc(META.businessContact):''}</p>`:''}${tb&&META.clientName?`<p class="sm2">Prepared for ${esc(META.clientName)}${META.siteAddress?', '+esc(META.siteAddress):''}</p>`:''}<p class="sm2">Generated ${new Date().toLocaleDateString('en-AU')} from the SwiftScope build planner. All dimensions in cm unless noted.</p>
  <table class="spec">
  <tr><th>Type</th><td>${STYPES[stype()]}</td></tr>
  <tr><th>Size</th><td>${S.width/10} × ${S.length/10} cm outside frame, ${fm(S.width*S.length/1e6,1)} m² floor</td></tr>
  ${stype()==='deck'?'':`  <tr><th>Wall height</th><td>${S.height/10} cm</td></tr>`}
  ${stype()==='deck'?'':`  <tr><th>Roof</th><td>${{gable:'Gable',skillion:'Skillion',flat:'Flat'}[S.roof]}, ${D.pd}° pitch, ${dirOpt.toLowerCase()}, ${S.overhang/10} cm overhang, ${D.roof==='gable'?'ridge':'high side'} ${cmv(peakHeight(D))} cm</td></tr>`}
  ${stype()==='deck'?'':`  <tr><th>Roof cover</th><td>${RM.n}${RM.color?'':', '+S.roofColor}</td></tr>`}
  <tr><th>Walls</th><td>${isEnclosed()?`${WM.n}${S.wallMat==='ply'?'':', '+S.wallColor}${(plan.walls||[]).length?`, ${plan.walls.length} internal wall${plan.walls.length>1?'s':''}`:''}`:'Open sides'}</td></tr>
  <tr><th>${isEnclosed()?'Wall frame':stype()==='deck'?'Balustrade':'Posts and beams'}</th><td>${isEnclosed()?`${S.studSize} studs at ${S.studSpacing/10} cm centres`:stype()==='deck'?(S.balustrade==='none'?'None':`Timber, 1 m high, ${S.balSides==='all'?'all sides':'three sides'}`):`${S.postSize} posts at up to ${S.postSpacing/10} cm, doubled ${S.beamSize} beams${stype()==='verandah'?', ledger on the house':''}`}</td></tr>
  ${stype()==='deck'?'':`  <tr><th>Roof frame</th><td>${S.rafterSize} rafters at up to ${S.rafterSpacing/10} cm centres, 70 x 35 battens at up to ${S.battenSpacing/10} cm</td></tr>`}
  <tr><th>Floor</th><td>${floorDesc()}</td></tr>${(plan.planRooms||[]).length?`<tr><th>Rooms on the uploaded plan</th><td>${plan.planRooms.map(r=>esc(r.name)+(r.width&&r.length?` ${r.width/10} × ${r.length/10}`:'')).join(', ')}</td></tr>`:''}</table>
  <p class="warnbox">These are guide drawings made from the model, not engineered plans. Before building, check with council whether a permit is needed and how far the structure must sit from boundaries, confirm your wind region, and follow AS 1684 and the manufacturers’ instructions for bracing, tie-downs and fixings. Lodge a free Before You Dig Australia enquiry (byda.com.au) before digging.</p></section>`;
  h+=`<section class="sheet"><h2>1. Floor plan</h2>${floorPlanSVG(codes)}<h3 class="eh">Door and window schedule</h3>${scheduleHTML(codes)}</section>`;
  h+=`<section class="sheet"><h2>2. ${S.floor==='timber'?'Floor framing plan':S.floor==='slab'?'Slab plan':'Base plan'}</h2>${floorBaseSVG()}</section>`;
  if(isEnclosed())h+=`<section class="sheet"><h2>3. Wall framing elevations</h2><p class="sm2">Each wall is drawn as seen from outside. Studs at ${S.studSpacing/10} cm centres, noggings at mid height, lintels in darker timber. Dimension rows under each wall give the distance from the left end to each opening, then its width.</p>${['front','right','back','left'].map(k=>elevSVG(k,codes)).join('')}</section>`;
  else h+=`<section class="sheet"><h2>3. ${stype()==='deck'?'Balustrade':'Posts and beams'}</h2><p class="sm2">${postsNote()}</p></section>`;
  if(stype()!=='deck')h+=`<section class="sheet"><h2>4. Roof framing</h2>${roofPlanSVG()}${sectionSVG()}</section>`;
  h+=`<section class="sheet"><h2>5. Cut list</h2>${cutListHTML()}</section>`;
  h+=`<section class="sheet"><h2>6. Build guide</h2>${guideHTML(codes)}</section>`;
  h+=servicesHTML();
  return h;
}

function floorPlanSVG(codes){
  const S=plan.shed,D=dims();const W=S.width/1000,L=S.length/1000,d=D.d;
  const sc=Math.min(640/W,420/L),m=80,vw=W*sc+2*m,vh=L*sc+2*m+20;
  const X=x=>m+(x+W/2)*sc,Y=z=>m+(z+L/2)*sc,P2=p=>X(p[0])+','+Y(p[1]);
  let g=`<rect x="${X(-W/2)}" y="${Y(-L/2)}" width="${W*sc}" height="${L*sc}" class="wl"/><rect x="${X(-W/2+d)}" y="${Y(-L/2+d)}" width="${(W-2*d)*sc}" height="${(L-2*d)*sc}" class="fl"/>`;
  if(!isEnclosed())g=`<rect x="${X(-W/2)}" y="${Y(-L/2)}" width="${W*sc}" height="${L*sc}" class="fl"/>`+lastPosts.map(q=>`<rect x="${X(q.x)-5}" y="${Y(q.z)-5}" width="10" height="10" class="wl"/>`).join('');
  lastInner.forEach(w=>{const segs=w.da!=null?[[0,w.da],[w.db,w.len]]:[[0,w.len]];segs.forEach(([a,b])=>{if(b-a<0.01)return;if(w.across)g+=`<rect x="${X(-W/2+w.d+a)}" y="${Y(w.pos)-w.d*sc/2}" width="${(b-a)*sc}" height="${w.d*sc}" class="wl"/>`;else g+=`<rect x="${X(w.pos)-w.d*sc/2}" y="${Y(L/2-w.d-b)}" width="${w.d*sc}" height="${(b-a)*sc}" class="wl"/>`;});});
  plan.items.forEach(it=>{const w=it.w/1000,dd=it.d/1000,ph=-it.rot*Math.PI/180;const c=Math.cos(ph),s=Math.sin(ph);
    const pts=[[-w/2,-dd/2],[w/2,-dd/2],[w/2,dd/2],[-w/2,dd/2]].map(([lx,lz])=>[it.x/1000+lx*c+lz*s,it.z/1000-lx*s+lz*c]);
    g+=`<polygon points="${pts.map(P2).join(' ')}" class="it"/><text x="${X(it.x/1000)}" y="${Y(it.z/1000)+4}" text-anchor="middle" class="sm">${esc(it.name)}</text>`;});
  const WW=worldWalls();
  (isEnclosed()?plan.openings:[]).forEach(o=>{
    const wd=WW[o.wall];const c0=wd.len/2+o.offset/1000,w=o.width/1000;const a=c0-w/2,b=c0+w/2;
    const pt=(s,off)=>[wd.o[0]+wd.dir[0]*s-wd.n[0]*off,wd.o[1]+wd.dir[1]*s-wd.n[1]*off];

  return {width:S.width,length:S.length,height:S.height,roof:S.roof,floor:S.floor,area:Math.round(D.W*D.L*100)/100,openings:plan.openings.length,
    description:stype()==='deck'?`${S.width/10} × ${S.length/10} cm deck, ${S.floorH/10} cm high`:`${isEnclosed()?'':STYPES[stype()].split(' (')[0]+', '}${S.width/10} × ${S.length/10} cm ${({gable:'gable',skillion:'skillion',flat:'flat'})[S.roof]} roof, ${isEnclosed()?(WALL_MATS[S.wallMat]||WALL_MATS.corr).n.toLowerCase()+' walls':'open sides'}, ${(FLOORS[S.floor]||'').toLowerCase()}`,
    materialsTotal:Math.round(mat*100)/100,labourHours:hrs,labourRate:labourRate(),unpriced:lines.filter(l=>!l.unitCost).length,trades:Object.keys(TRADES).filter(tradeOn).map(id=>TRADES[id].n),sections:Object.keys(SECTIONS).filter(inScope).map(s=>SECTIONS[s]),
    labour:st.map(s=>({key:s.k,label:s.n,hours:s.hrs})),lines};}
function postPlan(){try{window.parent.postMessage({source:'ss-planner',type:'change',plan:Object.assign({},plan,{selected:null}),summary:summary()},location.origin);}catch(e){}}
if(EMBED){
  $('#btnFile').hidden=true;
  window.addEventListener('message',e=>{
    if(e.origin!==location.origin||e.source!==window.parent)return;const d=e.data||{};if(d.target!=='ss-planner')return;
    if(d.type==='load'){if(d.meta)META=d.meta;if(Array.isArray(d.templates))BIZ_TEMPLATES=d.templates;
      PB.set(d.pricebook);if(d.settings)SETTINGS=Object.assign(SETTINGS,d.settings);
      plan=d.plan&&d.plan.shed?migrate(d.plan):defaultPlan();if(!d.plan||!d.plan.shed)applyTradeDefaults(d.trades);if(d.prices&&!Object.keys(plan.prices).length)plan.prices=Object.assign({},d.prices);
      plan.selected=null;refreshAll();
      if(!d.plan||!d.plan.shed){if($('#tab-materials').classList.contains('on'))renderMaterials();postPlan();}}
    if(d.type==='meta'){META=Object.assign(META,d.meta||{});}
    if(d.type==='templates'){BIZ_TEMPLATES=Array.isArray(d.templates)?d.templates:[];tplMsg=d.message||'';renderShedTab();}
    if(d.type==='print'){openPlans();setTimeout(()=>{try{window.print();}catch(_){}},150);}
    if(d.type==='flush'){clearTimeout(saveT);postPlan();}
  });
}
refreshAll();resize();loop();
if(EMBED){try{window.parent.postMessage({source:'ss-planner',type:'ready'},location.origin);}catch(e){}}
})();
</script>
