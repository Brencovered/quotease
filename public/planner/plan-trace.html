<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>House Plan</title>
<style>
@font-face{font-family:"Archivo";font-weight:400;font-display:swap;src:url(/planner/vendor/archivo-400.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:600;font-display:swap;src:url(/planner/vendor/archivo-600.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:700;font-display:swap;src:url(/planner/vendor/archivo-700.woff2) format("woff2");}
@font-face{font-family:"Archivo";font-weight:800;font-display:swap;src:url(/planner/vendor/archivo-800.woff2) format("woff2");}
.tpl{display:flex;gap:8px;align-items:center;margin:4px 0 6px;}
.desc textarea{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--field);padding:10px 12px;font-size:14px;line-height:1.4;}
.desc .btns{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;}
.desc .btn.rec{background:var(--bad);color:#fff;border-color:var(--bad);}
.descmsg{margin:8px 0 0;font-size:12.5px;color:var(--muted);}
.descmsg.err{color:var(--bad);}
.descmsg ul{margin:4px 0 0;padding-left:18px;}
.descmsg a{color:inherit;font-weight:700;}
.upl{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}
.upl .note{margin:0;flex:1;min-width:160px;}
.savetpl{display:flex;gap:8px;margin-top:8px;}
.card.trade{margin-top:10px;}
.card.trade .row{padding:6px 0;}
.scope{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:12px 0 4px;}
.scope .note{margin:0 4px 0 0;}
.mi .pbk{display:block;font-size:11.5px;color:var(--ok);}
.dwg .sv{fill:#fff;stroke:#1f2a33;stroke-width:1.5;}
.dwg .svl{fill:#f2b705;stroke:#1f2a33;stroke-width:1;}
.dwg .svb{fill:#cfd6da;stroke:#1f2a33;stroke-width:1.5;}
.dwg .svd{fill:#2f6fb0;stroke:#1f2a33;stroke-width:1;fill-opacity:0.85;}
.savetpl input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;background:var(--field);padding:7px 10px;}
.tpl select{flex:1;min-width:0;}
.lab .mrow{grid-template-columns:1fr auto;}
.lab .inp input{width:72px;}
.ttl{display:grid;grid-template-columns:1fr auto;gap:4px 12px;margin-top:10px;font-size:13.5px;}
.ttl b{text-align:right;font-variant-numeric:tabular-nums;}
.ttl .big{font-size:15px;font-weight:800;}
body.embed .ph{padding:10px 18px 8px;}
body.embed .ph p{display:none;}
:root{
  --bg:#e9edef; --panel:#f7f9fa; --text:#1f2a33; --muted:#5d6b75; --line:#d3dade; --field:#ffffff;
  --accent:#f2b705; --accent-ink:#1f2a33; --ink:#22303a; --chip:#e3e8eb; --chip-on:#22303a; --chip-on-ink:#f7f9fa;
  --scene-bg:#dce4e8; --scene-ground:#b7c0a8; --grid1:#7f8a75; --grid2:#9ca690;
  --ok:#2f7d4a; --bad:#b8362b; --pine:#d9b47a;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121a20; --panel:#18222a; --text:#e6ebee; --muted:#93a3ad; --line:#2a3741; --field:#1f2b34;
    --accent:#f2b705; --accent-ink:#1a1400; --ink:#e6ebee; --chip:#22303a; --chip-on:#f2b705; --chip-on-ink:#1a1400;
    --scene-bg:#1a242c; --scene-ground:#2b3327; --grid1:#4b5645; --grid2:#3a4336;
    --ok:#5cc07c; --bad:#ef6b5e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121a20; --panel:#18222a; --text:#e6ebee; --muted:#93a3ad; --line:#2a3741; --field:#1f2b34;
  --accent:#f2b705; --accent-ink:#1a1400; --ink:#e6ebee; --chip:#22303a; --chip-on:#f2b705; --chip-on-ink:#1a1400;
  --scene-bg:#1a242c; --scene-ground:#2b3327; --grid1:#4b5645; --grid2:#3a4336;
  --ok:#5cc07c; --bad:#ef6b5e;
  color-scheme: dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.45;overflow:hidden;}
button,input,select,textarea{font:inherit;color:inherit;}
.app{display:grid;grid-template-columns:minmax(330px,380px) 1fr;height:100%;}
.panel{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line);}
.ph{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 18px 12px;}
.brand{display:flex;align-items:center;gap:12px;}
.logo{width:38px;height:38px;flex:none;}
h1{margin:0;font-size:22px;line-height:1;font-weight:800;font-stretch:118%;letter-spacing:-0.01em;}
.ph p{margin:3px 0 0;color:var(--muted);font-size:13px;}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);}
.tabs button{flex:1;background:none;border:0;padding:10px 2px 9px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;font-stretch:96%;}
.tabs button.on{color:var(--text);border-bottom-color:var(--accent);}
.tabs button:focus-visible,button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.tabbody{flex:1;overflow:auto;padding:4px 18px 28px;-webkit-overflow-scrolling:touch;}
.tab{display:none;}
.tab.on{display:block;}
h3{margin:20px 0 8px;font-size:13px;font-weight:700;font-stretch:110%;color:var(--muted);}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;}
.row>span:first-child{font-size:14px;}
.inp{display:inline-flex;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:6px;overflow:hidden;}
.inp input{width:92px;border:0;background:transparent;padding:7px 8px;text-align:right;font-variant-numeric:tabular-nums;}
.inp em{font-style:normal;color:var(--muted);font-size:12px;padding:0 9px 0 2px;min-width:24px;}
.inp.sm input{width:70px;padding:5px 6px;}
select{max-width:210px;}
select,.textin{background:var(--field);border:1px solid var(--line);border-radius:6px;padding:7px 8px;min-width:130px;}
.textin{width:100%;}
input[type=checkbox]{width:20px;height:20px;accent-color:var(--ink);}
input[type=color]{width:44px;height:32px;border:1px solid var(--line);border-radius:6px;background:var(--field);padding:2px;}
.colsel{display:inline-flex;align-items:center;gap:8px;}
.colsel i{width:22px;height:22px;border-radius:4px;border:1px solid rgba(0,0,0,.25);display:inline-block;}
.summary{margin-top:18px;padding:12px 14px;border-radius:8px;background:var(--chip);font-size:13.5px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;font-variant-numeric:tabular-nums;}
.summary b{font-weight:700;text-align:right;}
.note{color:var(--muted);font-size:12.5px;margin:12px 0 0;max-width:60ch;}
.addrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on);}
.card{border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-top:10px;background:var(--field);}
.cardh{display:flex;gap:6px;align-items:center;}
.cardh select{min-width:0;flex:1;}
.x{border:0;background:none;color:var(--muted);font-size:16px;width:32px;height:32px;border-radius:6px;cursor:pointer;flex:none;}
.x:hover{background:var(--chip);color:var(--bad);}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;margin-top:8px;}
.grid2 label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);}
.grid2 .inp input{width:100%;}
.grid2 .inp{width:100%;}
.warn{font-size:12.5px;color:var(--bad);margin-top:6px;min-height:0;}
.warn:empty{display:none;}
.empty{color:var(--muted);font-size:14px;padding:14px 0;}
.lib{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.libbtn{text-align:left;border:1px solid var(--line);background:var(--field);border-radius:8px;padding:8px 10px;cursor:pointer;display:flex;flex-direction:column;gap:1px;}
.libbtn:hover{border-color:var(--ink);}
.libbtn b{font-size:13.5px;font-weight:650;}
.libbtn small{color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;}
.ilist{display:flex;flex-direction:column;gap:4px;}
.irow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--field);cursor:pointer;text-align:left;width:100%;}
.irow.sel{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);}
.irow .sw{width:14px;height:14px;border-radius:3px;flex:none;border:1px solid rgba(0,0,0,.2);}
.irow .nm{flex:1;min-width:0;font-size:14px;}
.irow .nm small{display:block;color:var(--muted);font-size:11.5px;font-variant-numeric:tabular-nums;}
.badge{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;}
.badge.ok{color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,transparent);}
.badge.bad{color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,transparent);}
.editor{margin-top:12px;padding:12px;border-radius:8px;background:var(--chip);}
.editor .btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}
.btn{border:1px solid var(--line);background:var(--field);border-radius:6px;padding:7px 12px;font-weight:600;font-size:13px;cursor:pointer;}
.btn.danger{color:var(--bad);}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 14px;font-weight:700;cursor:pointer;}
.mtable{display:flex;flex-direction:column;}
.mrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:8px 0;border-bottom:1px solid var(--line);}
.mi b{font-weight:650;font-size:14px;}
.mi .sz{color:var(--muted);font-size:12.5px;margin-left:4px;}
.mi small{display:block;color:var(--muted);font-size:12px;}
.mi .bun{margin-top:2px;}.mi .bun a{color:inherit;text-decoration-color:var(--accent);text-underline-offset:2px;}.bunbar{display:flex;flex-direction:column;gap:6px;margin-top:14px;}.bunbar .primary{align-self:flex-start;}
.mq{grid-column:1;font-size:12.5px;font-variant-numeric:tabular-nums;}
.mp{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.cost{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);}
.total{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 12px;padding:12px 14px;border-radius:8px;background:var(--ink);color:var(--panel);}
.total b{font-size:20px;font-stretch:115%;font-variant-numeric:tabular-nums;}
.stage{position:relative;min-width:0;min-height:0;overflow:hidden;}
#viewport{position:absolute;inset:0;}
#viewport canvas{display:block;width:100%;height:100%;touch-action:none;}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.tag{position:absolute;left:0;top:0;background:var(--accent);color:var(--accent-ink);font-size:12px;font-weight:700;padding:2px 7px;border-radius:3px;white-space:nowrap;font-variant-numeric:tabular-nums;font-stretch:92%;box-shadow:0 1px 0 rgba(0,0,0,.25);}
.tbar{position:absolute;display:flex;flex-wrap:wrap;gap:6px;}
.tbar.views{top:12px;right:12px;justify-content:flex-end;}
.tbar.layers{left:12px;bottom:12px;right:12px;align-items:center;}
.tbar .chip{background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.tbar .chip.on{background:var(--chip-on);}
.xray{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);}
.xray input{width:90px;accent-color:var(--accent);}
.stats{position:absolute;top:12px;left:12px;font-size:13px;line-height:1.35;padding:8px 12px;border-radius:8px;background:color-mix(in srgb,var(--panel) 88%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);font-variant-numeric:tabular-nums;}
.stats b{font-size:16px;font-weight:800;font-stretch:115%;display:block;}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text);max-width:min(560px,92vw);padding:0;}
dialog::backdrop{background:rgba(10,15,20,.5);}
.dlg{padding:18px 20px;}
.dlg h2{margin:0 0 6px;font-size:19px;font-stretch:115%;}
.dlg p{margin:0 0 10px;font-size:14px;color:var(--muted);}
.dlg textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--field);border:1px solid var(--line);border-radius:6px;padding:8px;}
.dlgbtns{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;}

.plansov{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:auto;-webkit-overflow-scrolling:touch;}
.plansov[hidden]{display:none;}
.pbar{position:sticky;top:0;z-index:2;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top,0px)) 18px 10px;background:var(--panel);border-bottom:1px solid var(--line);}
.pbar b{font-size:17px;font-stretch:112%;}
.pbar span{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}
.pdoc{max-width:980px;margin:0 auto;padding:18px 16px 40px;}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:18px;}
.sheet h2{margin:0 0 10px;font-size:20px;font-stretch:115%;}
.eh{color:var(--text);font-size:15px;margin:18px 0 4px;}
.sm2{color:var(--muted);font-size:13px;margin:6px 0 0;max-width:72ch;}
.spec,.tbl{border-collapse:collapse;width:100%;font-size:14px;margin-top:8px;}
.spec th{text-align:left;width:130px;color:var(--muted);font-weight:600;padding:5px 10px 5px 0;vertical-align:top;}
.spec td,.tbl td{padding:5px 8px 5px 0;border-bottom:1px solid var(--line);vertical-align:top;}
.tbl th{text-align:left;font-size:12.5px;color:var(--muted);padding:6px 8px 6px 0;border-bottom:1px solid var(--line);}
.tblwrap{overflow-x:auto;}
.warnbox{margin-top:14px;padding:10px 12px;border-left:3px solid var(--accent);background:var(--chip);font-size:13.5px;border-radius:4px;}
.dwg{width:100%;height:auto;display:block;margin-top:6px;}
.dwg text{font-family:"Archivo",system-ui,sans-serif;}
.dwg .wl{fill:var(--muted);fill-opacity:.35;stroke:var(--text);stroke-width:1;}
.dwg .fl{fill:var(--field);stroke:var(--text);stroke-width:1;}
.dwg .gap{fill:var(--field);stroke:none;}
.dwg .win{stroke:#2f7fbf;stroke-width:3;}
.dwg .roll{stroke:#2f7fbf;stroke-width:2.5;stroke-dasharray:6 3;}
.dwg .ln{stroke:var(--text);stroke-width:1.4;fill:none;}
.dwg .arc{stroke:var(--muted);stroke-width:1;fill:none;stroke-dasharray:3 3;}
.dwg .it{fill:#f2b705;fill-opacity:.12;stroke:var(--muted);stroke-dasharray:4 3;}
.dwg .code{fill:#2f7fbf;font-size:12px;font-weight:700;}
.dwg .lbl{fill:var(--text);font-size:13px;font-weight:600;}
.dwg .sm{fill:var(--muted);font-size:11px;}
.dwg .dim line{stroke:#b07d00;stroke-width:1;}
.dwg .dim text{fill:var(--text);font-size:12px;font-weight:600;}
.dwg .tm{fill:#ecd3a1;stroke:#8a6630;stroke-width:.7;}
.dwg .tm2{fill:#c9995a;stroke:#6f4f22;stroke-width:.7;}
.dwg .op{fill:#2f7fbf;fill-opacity:.07;stroke:#2f7fbf;stroke-width:1.2;stroke-dasharray:5 3;}
.dwg .ol{fill:none;stroke:var(--muted);stroke-width:1;}
.dwg .rf{fill:var(--muted);fill-opacity:.15;stroke:var(--text);stroke-width:1;}
.dwg .wd{fill:none;stroke:var(--text);stroke-width:1;stroke-dasharray:6 4;}
.dwg .raf{stroke:#8a6630;stroke-width:2;}
.dwg .bat{stroke:#c49a63;stroke-width:1;}
.dwg .rdg{stroke:var(--text);stroke-width:3;}
.dwg .hi{stroke:var(--bad);stroke-width:3;}
.dwg .jst{stroke:#c49a63;stroke-width:1.2;}
.dwg .bea{fill:#b8894a;stroke:#6f4f22;stroke-width:.6;}
.dwg .stp{fill:var(--text);}
.dwg .grd{stroke:var(--muted);stroke-width:.5;}
.dwg .gnd{stroke:var(--text);stroke-width:1.5;}
.dwg .rfs{fill:var(--muted);fill-opacity:.5;stroke:var(--text);stroke-width:1;}
.steps{padding-left:22px;margin:8px 0 0;}
.steps>li{margin:0 0 14px;}
.steps>li>b{font-size:15.5px;}
.steps ul{margin:4px 0 0;padding-left:18px;}
.steps ul li{margin:3px 0;font-size:14px;max-width:75ch;}
.incl{margin:4px 0 0;padding-left:18px;font-size:14px;}
.pick{position:absolute;top:70px;right:12px;width:320px;max-height:calc(100% - 140px);overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;box-shadow:0 6px 24px rgba(0,0,0,.18);z-index:5;}
.pick[hidden]{display:none;}
.pkh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
.pkh b{font-size:16px;font-stretch:110%;}
.pkh small{display:block;color:var(--muted);font-size:12.5px;}
.pkn{font-size:13px;color:var(--muted);margin:6px 0 2px;}
.pick h4{margin:12px 0 6px;font-size:13px;color:var(--muted);}
.pick .grid2 .inp input{width:100%;}
.pick select{max-width:170px;}
.pkrow{margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--chip);font-size:13px;display:grid;grid-template-columns:1fr auto;gap:2px 8px;align-items:center;}
.pkrow small{grid-column:1 / -1;color:var(--muted);font-size:11.5px;}
.step{display:inline-flex;align-items:center;gap:6px;margin-left:8px;vertical-align:middle;}
.step button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--field);cursor:pointer;font-weight:700;line-height:1;padding:0;}
.step b{min-width:22px;text-align:center;font-variant-numeric:tabular-nums;font-size:12.5px;}
.parts{display:flex;flex-direction:column;gap:8px;}
.part{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;font-size:13px;}
.part .pn a{display:block;font-size:11.5px;color:var(--muted);}
.pick .btns{margin-top:12px;}
.stats .hint{display:block;color:var(--muted);font-size:11.5px;margin-top:2px;}
@media (max-width:820px){.pick{top:auto;bottom:96px;left:8px;right:8px;width:auto;max-height:62%;}}
@media print{
  :root{--bg:#fff;--panel:#fff;--text:#000;--muted:#555;--line:#bbb;--field:#fff;--chip:#f2f2f2;padding:0;}
  html,body{height:auto;overflow:visible;background:#fff;}
  .app,.pbar,dialog{display:none!important;}
  .plansov{position:static;overflow:visible;}
  .pdoc{max-width:none;padding:0;}
  .sheet{border:0;padding:0;margin:0 0 8mm;}
  .sheet+.sheet{break-before:page;}
  .dwg{break-inside:avoid;}
}
@media (max-width:820px){
  body{overflow:hidden;}
  .app{grid-template-columns:1fr;grid-template-rows:52% 48%;}
  .stage{grid-row:1;}
  .panel{grid-row:2;border-right:0;border-top:1px solid var(--line);}
  .ph{padding:10px 14px 6px;}
  .ph p{display:none;}
  h1{font-size:19px;}
  .logo{width:30px;height:30px;}
  .tabbody{padding:2px 14px 24px;}
  .stats{font-size:12px;padding:6px 10px;}
  .stats b{font-size:14px;}
  .tbar.views{top:auto;bottom:52px;right:8px;left:8px;justify-content:flex-start;}
  .tbar.layers{bottom:8px;left:8px;right:8px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;}
  .tbar .chip{padding:5px 10px;font-size:12.5px;white-space:nowrap;}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important;}}

[hidden]{display:none!important;}
#svgwrap,#v3{position:absolute;inset:0;}
#ed{width:100%;height:100%;display:block;touch-action:none;user-select:none;background:var(--scene-bg);}

<script>
(function(){
'use strict';
const $=(s,el=document)=>el.querySelector(s);
const uid=()=>Math.random().toString(36).slice(2,9);
const STORE='plan-trace-v1';
const EMBED=(()=>{try{return new URLSearchParams(location.search).has('embed')&&window.parent!==window;}catch(e){return false;}})();
let META={},SETTINGS={hourlyRate:95},PRICEBOOK=[];
if(EMBED)document.body.classList.add('embed');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fm=(v,dp=1)=>(+v||0).toFixed(dp);
const money=v=>'$'+(v||0).toLocaleString('en-AU',{minimumFractionDigits:2,maximumFractionDigits:2});
const bunSearch=q=>'https://www.bunnings.com.au/search/products?q='+encodeURIComponent(q);

/* ---------- vocab ---------- */
const ROOM_TYPES={bed:'Bedroom',living:'Living or dining',kitchen:'Kitchen',bath:'Bathroom',ens:'Ensuite',wc:'Toilet',laundry:'Laundry',hall:'Hall or entry',robe:'Robe, pantry or store',garage:'Garage',study:'Study',other:'Other'};
const WET=new Set(['bath','ens','wc','laundry']);
const FINISHES={tiles:'Tiles',carpet:'Carpet',hybrid:'Hybrid or vinyl plank',timber:'Timber boards',epoxy:'Epoxy',none:'None or existing'};
const DEF_FINISH={bed:'carpet',living:'hybrid',kitchen:'hybrid',bath:'tiles',ens:'tiles',wc:'tiles',laundry:'tiles',hall:'hybrid',robe:'carpet',garage:'none',study:'carpet',other:'hybrid'};
const DEF_GPO={bed:3,living:5,kitchen:6,bath:1,ens:1,wc:0,laundry:2,hall:1,robe:0,garage:3,study:4,other:2};
const FANS=new Set(['bath','ens','wc','laundry']);
const ROOM_FIX={bath:['basin','wc','shower','bath'],ens:['basin','wc','shower'],wc:['wc'],kitchen:['sink','dishwasher'],laundry:['tub','washer']};
const FIX_N={basin:'Basin and vanity with mixer',wc:'Toilet suite',shower:'Shower mixer, rose and waste',bath:'Bath with spout, mixer and waste',sink:'Kitchen sink with mixer',dishwasher:'Dishwasher connection',tub:'Laundry tub with mixer',washer:'Washing machine taps'};
const OPEN_T={door:{n:'Door',w:820,h:2040,sill:0},window:{n:'Window',w:1200,h:1200,sill:900},slider:{n:'Sliding door',w:2100,h:2100,sill:0},garage:{n:'Garage door',w:2400,h:2100,sill:0}};
const SECTIONS={build:'Structure',floor:'Slab and floor',roof:'Roofing',line:'Insulation and lining',finish:'Floor and wall finishes',elec:'Electrical',plumb:'Plumbing',paint:'Painting'};
function guessType(name){const n=String(name||'').toLowerCase();if(/ens/.test(n))return 'ens';if(/bath/.test(n))return 'bath';if(/\bwc\b|toilet|powder/.test(n))return 'wc';if(/laund|ldry/.test(n))return 'laundry';if(/kitch|meals/.test(n))return 'kitchen';if(/bed|master/.test(n))return 'bed';if(/garage|carport/.test(n))return 'garage';if(/robe|wir\b|store|pantry|ptry|linen/.test(n))return 'robe';if(/hall|entry|foyer|passage/.test(n))return 'hall';if(/study|office/.test(n))return 'study';if(/living|family|lounge|dining|rumpus|theatre|meals/.test(n))return 'living';return 'other';}

/* ---------- document ---------- */
function defaultDoc(){return {kind:'house',v:1,underlay:{src:null,path:null,w:0,h:0,opacity:0.55},scale:null,outline:[],walls:[],openings:[],rooms:[],
  settings:{wallH:2400,extThk:250,intThk:90,extStud:'90x45',intStud:'90x35',studSp:450,extClad:'brick',roofType:'hip',pitch:22.5,eave:450,roofMat:'tiles',floor:'slab',slabT:100,lineGarage:false},
  prices:{},waste:10,labour:{},labourRate:null,scope:null,draft:false};}
function migrate(p){const d=defaultDoc();p=p||{};return Object.assign({},d,p,{kind:'house',underlay:Object.assign({},d.underlay,p.underlay||{}),settings:Object.assign({},d.settings,p.settings||{}),
  outline:Array.isArray(p.outline)?p.outline:[],walls:Array.isArray(p.walls)?p.walls:[],openings:Array.isArray(p.openings)?p.openings:[],rooms:Array.isArray(p.rooms)?p.rooms:[],prices:p.prices||{},labour:p.labour||{}});}
function load(){if(EMBED)return null;try{const r=localStorage.getItem(STORE);if(r)return migrate(JSON.parse(r));}catch(e){}
  try{const u=sessionStorage.getItem('trace-underlay');if(u){sessionStorage.removeItem('trace-underlay');const d=defaultDoc();d.underlay.src=u;return d;}}catch(e){}return null;}
let doc=load()||defaultDoc();
const undoStack=[];function snapshot(){undoStack.push(JSON.stringify(Object.assign({},doc,{underlay:Object.assign({},doc.underlay,{src:null})})));if(undoStack.length>60)undoStack.shift();}
function undo(){const s=undoStack.pop();if(!s)return;const src=doc.underlay.src;doc=migrate(JSON.parse(s));doc.underlay.src=src;changed(true);}
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{if(EMBED){postPlan();return;}try{localStorage.setItem(STORE,JSON.stringify(doc));}catch(e){try{localStorage.setItem(STORE,JSON.stringify(Object.assign({},doc,{underlay:Object.assign({},doc.underlay,{src:null})})));}catch(_){}}},350);}

/* ---------- geometry ---------- */
const canvasW=()=>doc.underlay.w||2400,canvasH=()=>doc.underlay.h||1600;
function scaleMM(){return doc.scale||(doc.underlay.src?null:10);} // mm per px; plain grid = 10 mm/px
const toM=px=>px*(scaleMM()||0)/1000;
const dist=(a,b)=>Math.hypot(a[0]-b[0],a[1]-b[1]);
function segs(){const out=[];const o=doc.outline,n=o.length;if(n>=3)for(let i=0;i<n;i++)out.push({a:o[i],b:o[(i+1)%n],ext:true,host:'o:'+i});
  doc.walls.forEach(w=>out.push({a:w.a,b:w.b,ext:false,host:'w:'+w.id,id:w.id}));return out;}
function projT(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1];const L2=dx*dx+dy*dy;if(!L2)return 0;return Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L2));}
const lerp=(a,b,t)=>[a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t];
function polyArea(P){let s=0;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];s+=a[0]*b[1]-b[0]*a[1];}return s/2;}
function pip(p,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if(((a[1]>p[1])!==(b[1]>p[1]))&&(p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0]))c=!c;}return c;}
function segX(a,b,c,d){const r=[b[0]-a[0],b[1]-a[1]],s=[d[0]-c[0],d[1]-c[1]];const den=r[0]*s[1]-r[1]*s[0];if(Math.abs(den)<1e-9)return null;const t=((c[0]-a[0])*s[1]-(c[1]-a[1])*s[0])/den,u=((c[0]-a[0])*r[1]-(c[1]-a[1])*r[0])/den;return (t>-1e-6&&t<1+1e-6&&u>-1e-6&&u<1+1e-6)?[t,u]:null;}
/* planar faces = rooms. Work in y-up so interior faces come out counter-clockwise. */
let facesCache=null;
function faces(){if(facesCache)return facesCache;const S=segs();if(doc.outline.length<3){facesCache=[];return facesCache;}
  const eps=Math.max(1.5,(canvasW()+canvasH())/4000);
  const params=S.map(()=>[0,1]);
  for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++){const x=segX(S[i].a,S[i].b,S[j].a,S[j].b);if(x){params[i].push(x[0]);params[j].push(x[1]);continue;}
    [[i,j],[j,i]].forEach(([p,q])=>{[S[p].a,S[p].b].forEach(e=>{const t=projT(e,S[q].a,S[q].b);if(dist(e,lerp(S[q].a,S[q].b,t))<eps)params[q].push(t);});});}
  const V=[];const vid=p=>{for(let k=0;k<V.length;k++)if(dist(V[k],p)<eps)return k;V.push(p);return V.length-1;};
  const E=new Map();
  S.forEach((s,i)=>{const ts=[...new Set(params[i].map(t=>Math.round(t*1e6)/1e6))].sort((x,y)=>x-y);for(let k=0;k<ts.length-1;k++){const u=vid(lerp(s.a,s.b,ts[k])),v=vid(lerp(s.a,s.b,ts[k+1]));if(u===v)continue;const key=u<v?u+'-'+v:v+'-'+u;const prev=E.get(key);E.set(key,{u:Math.min(u,v),v:Math.max(u,v),ext:(prev&&prev.ext)||s.ext,host:prev?prev.host:s.host});}});
  const out=V.map(()=>[]);E.forEach(e=>{out[e.u].push({to:e.v,e});out[e.v].push({to:e.u,e});});
  const ang=(f,t)=>Math.atan2(-(V[t][1]-V[f][1]),V[t][0]-V[f][0]);
  const used=new Set();const res=[];
  E.forEach(e=>[[e.u,e.v],[e.v,e.u]].forEach(([s0,t0])=>{if(used.has(s0+'>'+t0))return;const loop=[];let s=s0,t=t0,guard=0;
    while(guard++<5000){used.add(s+'>'+t);loop.push({v:s,e:out[s].find(o=>o.to===t).e});const back=ang(t,s);let best=null,bestA=-1;
      out[t].forEach(o=>{if(o.to===s&&out[t].length>1)return;let d=ang(t,o.to)-back;while(d<=0)d+=2*Math.PI;if(o.to===s)d=2*Math.PI;if(d>bestA){bestA=d;best=o;}});
      if(!best)break;s=t;t=best.to;if(s===s0&&t===t0)break;}
    const P=loop.map(l=>V[l.v]);const a=-polyArea(P);if(a>1)res.push({poly:P,edges:loop.map(l=>l.e),area:a});}));
  // drop the outer boundary face (largest positive face can only be interior; outer faces come out negative)
  facesCache=res.filter(f=>f.area>(scaleMM()?(700000/Math.pow(scaleMM(),2)):30));return facesCache;}
function invalidate(){facesCache=null;}
function rooms(){const sm=scaleMM()||0;const S=doc.settings;return faces().map((f,i)=>{const lab=doc.rooms.find(r=>pip(r.pt,f.poly));
  let per=0,extL=0,intL=0;for(let k=0;k<f.poly.length;k++){const L=toM(dist(f.poly[k],f.poly[(k+1)%f.poly.length]));per+=L;if(f.edges[k].ext)extL+=L;else intL+=L;}
  const gross=f.area*sm*sm/1e6;const net=Math.max(0.2,gross-extL*S.extThk/1000-intL*S.intThk/2000);const netPer=Math.max(0,per-8*(S.intThk/1000));
  const name=lab?lab.name:`Room ${i+1}`;const type=lab?lab.type:'other';
  return {i,f,lab,id:lab?lab.id:null,name,type,finish:lab&&lab.finish?lab.finish:DEF_FINISH[type],gpo:lab&&lab.gpo!=null?lab.gpo:DEF_GPO[type],lights:lab&&lab.lights!=null?lab.lights:Math.max(1,Math.ceil(net/2.5)),expect:lab?lab.expect:null,area:net,gross,per:netPer,extL,intL,
    centroid:f.poly.reduce((a,p)=>[a[0]+p[0]/f.poly.length,a[1]+p[1]/f.poly.length],[0,0])};});}
function hostOf(op){let best=null,bd=1e9;segs().forEach(s=>{const t=projT(op.pt,s.a,s.b);const d=dist(op.pt,lerp(s.a,s.b,t));if(d<bd){bd=d;best={s,t,d};}});const tol=Math.max(12,(doc.settings.extThk/(scaleMM()||10))*1.5);return best&&best.d<=tol?best:null;}
function outlineArea(){return Math.abs(polyArea(doc.outline))*Math.pow(scaleMM()||0,2)/1e6;}
function outlinePer(){let p=0;const o=doc.outline;for(let i=0;i<o.length;i++)p+=toM(dist(o[i],o[(i+1)%o.length]));return o.length>=3?p:0;}
function corners(){const o=doc.outline,n=o.length;if(n<3)return {convex:0,concave:0};const sgn=Math.sign(polyArea(o));let cv=0,cc=0;for(let i=0;i<n;i++){const a=o[(i+n-1)%n],b=o[i],c=o[(i+1)%n];const cr=(b[0]-a[0])*(c[1]-b[1])-(b[1]-a[1])*(c[0]-b[0]);if(Math.abs(cr)<1e-6)continue;if(Math.sign(cr)===sgn)cv++;else cc++;}return {convex:cv,concave:cc};}
function bbox(P){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);return {x0:Math.min(...xs),y0:Math.min(...ys),x1:Math.max(...xs),y1:Math.max(...ys)};}

/* ---------- 2D editor ---------- */
const svg=$('#ed');const NS='http://www.w3.org/2000/svg';
let view={x:0,y:0,k:1};let tool='select';let draft=[];let hover=null;let sel=null;let calibPts=[];let drag=null;
const TOOLS=[['select','Select'],['outline','Outline'],['wall','Wall'],['door','Door'],['window','Window'],['slider','Slider'],['garage','Garage door'],['room','Name room'],['scale','Scale'],['erase','Erase']];
function fitView(){const r=svg.getBoundingClientRect();if(!r.width)return;const W=canvasW(),H=canvasH();let b={x0:0,y0:0,x1:W,y1:H};if(!doc.underlay.src&&doc.outline.length>=3){const bb=bbox(doc.outline);b={x0:bb.x0-60,y0:bb.y0-60,x1:bb.x1+60,y1:bb.y1+60};}
  const top=92,bot=r.width<820?150:110,side=16;const aw=r.width-2*side,ah=Math.max(120,r.height-top-bot);const k=Math.min(aw/(b.x1-b.x0),ah/(b.y1-b.y0));view={k,x:b.x0-(side+(aw-(b.x1-b.x0)*k)/2)/k,y:b.y0-(top+(ah-(b.y1-b.y0)*k)/2)/k};}
function toDoc(ev){const r=svg.getBoundingClientRect();return [view.x+(ev.clientX-r.left)/view.k,view.y+(ev.clientY-r.top)/view.k];}
function snap(p,from,opts){opts=opts||{};const tol=12/view.k;let best=null;
  const pts=[...doc.outline,...doc.walls.flatMap(w=>[w.a,w.b]),...draft];pts.forEach(q=>{if(q===from)return;const d=dist(p,q);if(d<tol&&(!best||d<best.d))best={p:q.slice(),d,kind:'pt'};});
  if(best)return best.p;
  let q=p.slice();
  if(from&&!opts.free){const dx=q[0]-from[0],dy=q[1]-from[1];const a=Math.abs(Math.atan2(dy,dx)*180/Math.PI);const nearH=a<7||a>173,nearV=Math.abs(a-90)<7;if(nearH)q=[q[0],from[1]];else if(nearV)q=[from[0],q[1]];
    // line up with an existing point on the other axis
    pts.forEach(r=>{if(nearH&&Math.abs(r[0]-q[0])<tol)q=[r[0],q[1]];if(nearV&&Math.abs(r[1]-q[1])<tol)q=[q[0],r[1]];});}
  let bs=null;segs().forEach(s=>{const t=projT(q,s.a,s.b);const pr=lerp(s.a,s.b,t);const d=dist(q,pr);if(d<tol*0.8&&(!bs||d<bs.d))bs={p:pr,d};});

async function srcToCanvas(src,MAX,MIN){const im=await new Promise((res,rej)=>{const i=new Image();i.crossOrigin='anonymous';i.onload=()=>res(i);i.onerror=rej;i.src=src;});const big=Math.max(im.naturalWidth,im.naturalHeight);let sc=Math.min(1,MAX/big);if(MIN&&big<MIN)sc=Math.min(3,MIN/big);const c=document.createElement('canvas');c.width=Math.round(im.naturalWidth*sc);c.height=Math.round(im.naturalHeight*sc);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);g.drawImage(im,0,0,c.width,c.height);return c;}
async function fileToCanvas(file){const MAX=2600;if(file.type==='application/pdf'||/\.pdf$/i.test(file.name)){const lib=await loadPdfjs();const pdf=await lib.getDocument({data:await file.arrayBuffer()}).promise;const pg=await pdf.getPage(1);const v1=pg.getViewport({scale:1});const vp=pg.getViewport({scale:Math.min(4,MAX/Math.max(v1.width,v1.height))});const c=document.createElement('canvas');c.width=Math.round(vp.width);c.height=Math.round(vp.height);const g=c.getContext('2d');g.fillStyle='#fff';g.fillRect(0,0,c.width,c.height);await pg.render({canvasContext:g,viewport:vp}).promise;return c;}
  const url=URL.createObjectURL(file);try{return await srcToCanvas(url,MAX);}finally{setTimeout(()=>URL.revokeObjectURL(url),2000);}}
function canvasToJpeg(c,limit){let q=0.85,out=c.toDataURL('image/jpeg',q),cv=c;while(out.length>limit&&q>0.5){q-=0.1;out=cv.toDataURL('image/jpeg',q);}while(out.length>limit){const n=document.createElement('canvas');n.width=Math.round(cv.width*0.8);n.height=Math.round(cv.height*0.8);n.getContext('2d').drawImage(cv,0,0,n.width,n.height);cv=n;out=cv.toDataURL('image/jpeg',0.75);}return {url:out,w:cv.width,h:cv.height,scaled:cv.width/c.width};}
async function onUpload(file){if(!file)return;flash('Opening the plan...');try{const c=await fileToCanvas(file);const j=canvasToJpeg(c,3500000);snapshot();

    if(EMBED){try{window.parent.postMessage({source:'ss-planner',type:'underlay-upload',dataUrl:j.url,w:j.w,h:j.h},location.origin);}catch(e){}}

function orthogonalise(P,closed){const n=P.length;const out=P.map(p=>p.slice());const tan=Math.tan(12*Math.PI/180);for(let pass=0;pass<2;pass++)for(let i=0;i<(closed?n:n-1);i++){const a=out[i],b=out[(i+1)%n];const dx=b[0]-a[0],dy=b[1]-a[1];if(Math.abs(dx)<=Math.abs(dy)*tan){const x=(a[0]+b[0])/2;a[0]=x;b[0]=x;}else if(Math.abs(dy)<=Math.abs(dx)*tan){const y=(a[1]+b[1])/2;a[1]=y;b[1]=y;}}return out;}
function applyDraft(d){if(!d)return;const W=doc.underlay.w,H=doc.underlay.h;const P=v=>[v[0]/1000*W,v[1]/1000*H];snapshot();

  doc.walls=(d.walls||[]).map(w=>{let a=P([w[0],w[1]]),b=P([w[2],w[3]]);[a,b]=orthogonalise([a,b],false);return {id:uid(),a,b};}).filter(w=>dist(w.a,w.b)>8);

  invalidate();const tol=Math.max(W,H)/60;doc.walls.forEach(w=>{['a','b'].forEach(k=>{let best=null;segs().forEach(s=>{if(s.id===w.id)return;const t=projT(w[k],s.a,s.b);const p=lerp(s.a,s.b,t);const dd=dist(p,w[k]);if(dd<tol&&(!best||dd<best.d))best={p,d:dd};});if(best)w[k]=best.p;});});
  doc.rooms=(d.rooms||[]).map(r=>({id:uid(),name:r.name||'Room',type:guessType(r.name),pt:P([r.x,r.y]),expect:(r.width>0&&r.length>0)?r.width*r.length/1e6:null,dims:(r.width>0&&r.length>0)?[r.width,r.length]:null}));
  doc.openings=(d.openings||[]).map(o=>({id:uid(),type:OPEN_T[o.type]?o.type:'door',pt:P([o.x,o.y]),width:o.width||OPEN_T[o.type||'door'].w,height:OPEN_T[o.type||'door'].h,sill:OPEN_T[o.type||'door'].sill})).filter(o=>hostOf(o));
  doc.draft=true;invalidate();

  if(!doc.scale){const s=autoScale();if(s){doc.scale=s;invalidate();msg=`AI draft added and the scale was worked out from the room sizes (1 m = ${fm(1000/s,0)} px). Check it with the Scale tool, then drag corners onto the real walls.`;}else msg+=' Set the scale with the Scale tool.';}
  changed(true);setTool('select');flash(msg);}
function autoScale(){const S=doc.settings;const cands=[];
  faces().forEach(f=>{const r=doc.rooms.find(x=>x.dims&&pip(x.pt,f.poly));if(!r)return;const bb=bbox(f.poly);const tol=(bb.x1-bb.x0+bb.y1-bb.y0)/200+1;
    const side=(test)=>{let ext=false,hit=false;for(let k=0;k<f.poly.length;k++){const a=f.poly[k],c=f.poly[(k+1)%f.poly.length];if(test(a)&&test(c)){hit=true;if(f.edges[k].ext)ext=true;}}return hit?(ext?S.extThk:S.intThk/2):S.intThk/2;};
    const wAllow=side(p=>Math.abs(p[0]-bb.x0)<tol)+side(p=>Math.abs(p[0]-bb.x1)<tol),hAllow=side(p=>Math.abs(p[1]-bb.y0)<tol)+side(p=>Math.abs(p[1]-bb.y1)<tol);
    cands.push({w:bb.x1-bb.x0,h:bb.y1-bb.y0,wA:wAllow,hA:hAllow,dims:r.dims.slice().sort((x,y)=>x-y)});});
  if(!cands.length)return null;let s=null;
  for(let it=0;it<4;it++){const rs=[];cands.forEach(c=>{const iw=s?c.w-c.wA/s:c.w,ih=s?c.h-c.hA/s:c.h;if(iw<3||ih<3)return;const px=[iw,ih].sort((x,y)=>x-y);const r1=c.dims[0]/px[0],r2=c.dims[1]/px[1];if(!s||Math.abs(r1/r2-1)<0.15)rs.push(r1,r2);});
    if(rs.length<2){if(s)break;cands.forEach(c=>{const px=[c.w,c.h].sort((x,y)=>x-y);rs.push(c.dims[0]/px[0],c.dims[1]/px[1]);});}
    if(!rs.length)return null;rs.sort((x,y)=>x-y);s=rs[Math.floor(rs.length/2)];}

function planSVG(){const o=doc.outline;if(o.length<3)return '';const b=bbox(o);const pad=60;const W=b.x1-b.x0+2*pad,H=b.y1-b.y0+2*pad;const k=Math.min(900/W,620/H);const X=p=>((p[0]-b.x0+pad)*k).toFixed(1)+','+((p[1]-b.y0+pad)*k).toFixed(1);const sm=scaleMM();

function boxFilter(src,w,h,k,mode){const r0=Math.floor((k-1)/2),r1=k-1-r0;const tmp=new Uint8Array(w*h),out=new Uint8Array(w*h);const ps=new Int32Array(Math.max(w,h)+1);

function findBands(M,w,h,horiz,Lmin,maxT){const N=horiz?h:w,L=horiz?w:h;let active=[];const done=[];

    [[i,j],[j,i]].forEach(([p,q])=>{[S[p].a,S[p].b].forEach(e=>{const t=projT(e,S[q].a,S[q].b);if(dist(e,lerp(S[q].a,S[q].b,t))<eps)params[q].push(t);});});}

  S.forEach((s,i)=>{const ts=[...new Set(params[i].map(t=>Math.round(t*1e6)/1e6))].sort((x,y)=>x-y);for(let k=0;k<ts.length-1;k++){const u=vid(lerp(s.a,s.b,ts[k])),v=vid(lerp(s.a,s.b,ts[k+1]));if(u===v)continue;const key=u<v?u+'-'+v:v+'-'+u;const prev=E.get(key);E.set(key,{u:Math.min(u,v),v:Math.max(u,v),ext:(prev&&prev.ext)||s.ext,host:prev?prev.host:s.host});}});

    while(guard++<8000){used.add(s+'>'+t);loop.push({v:s,e:out[s].find(o=>o.to===t).e});const back=ang(t,s);let best=null,bestA=-1;

function simplifyOrtho(P,tol){let Q=P.slice();let changedQ=true;while(changedQ&&Q.length>3){changedQ=false;for(let i=0;i<Q.length;i++){const a=Q[(i+Q.length-1)%Q.length],b=Q[i],c=Q[(i+1)%Q.length];const cr=Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]))/Math.max(1e-6,dist(a,c));if(cr<tol||dist(a,b)<tol){Q.splice(i,1);changedQ=true;break;}}}return Q;}
function offsetOut(P,d){const n=P.length;const L=[];for(let i=0;i<n;i++){const a=P[i],b=P[(i+1)%n];const len=dist(a,b)||1;let nx=(b[1]-a[1])/len,ny=-(b[0]-a[0])/len;const m=lerp(a,b,0.5);if(pip([m[0]+nx*0.6,m[1]+ny*0.6],P)){nx=-nx;ny=-ny;}L.push({p:[a[0]+nx*d,a[1]+ny*d],q:[b[0]+nx*d,b[1]+ny*d]});}

async function detectPlan(){const U=doc.underlay;if(!U.src)return null;const c=await srcToCanvas(U.src,Math.max(U.w||0,U.h||0)||2600,1500);const w=c.width,h=c.height;const sx=(U.w||w)/w,sy=(U.h||h)/h;

  const opsD=[];ops.sort((p,q)=>q.wmm-p.wmm).forEach(o=>{if(!opsD.some(q=>dist(q.mid,o.mid)<Text*2*sx))opsD.push(o);});
  return {outline,walls,ops:opsD,mmPerPx:mmPx/((sx+sy)/2),text:Text};}
// Open plan spaces (family, kitchen, meals) share one face with no wall between them: one room, combined name and plan area.
function mergeOpenPlan(){faces().forEach(f=>{const L=doc.rooms.filter(r=>pip(r.pt,f.poly));if(L.length<2)return;const keep=L[0];keep.name=L.map(r=>r.name).join(' / ');keep.expect=L.every(r=>r.expect)?L.reduce((t,r)=>t+r.expect,0):null;keep.dims=null;doc.rooms=doc.rooms.filter(r=>r===keep||!L.includes(r));});invalidate();}
async function autoTrace(manual){if(!doc.underlay.src){flash('Upload a plan first.');return;}if(aiBusy)return;aiBusy=true;renderPlanTab();flash('Finding the walls on your plan...');
  try{const r=await detectPlan();const haveGeo=r&&r.outline.length>=3;
    if(haveGeo){snapshot();doc.outline=r.outline;doc.walls=r.walls;doc.rooms=[];doc.openings=r.ops.map(o=>({id:uid(),type:o.type,pt:o.mid,wpx:o.wpx,width:OPEN_T[o.type].w,height:OPEN_T[o.type].h,sill:OPEN_T[o.type].sill}));doc.scale=r.mmPerPx;doc.draft=true;invalidate();
      doc.openings=doc.openings.filter(o=>hostOf(o));}
    let labels=null,signup=false;
    try{let image=doc.underlay.src;if(!/^data:image\/jpeg/.test(image)||image.length>3500000){const c=await srcToCanvas(image,2200);image=canvasToJpeg(c,3500000).url;}
      const res=await fetch('/api/structures/trace-draft',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({image})});const b=await res.json().catch(()=>({}));if(res.ok)labels=b.draft;else signup=!!b.signup;}catch(e){}
    if(!haveGeo){if(labels){applyDraft(labels);return;}flash(signup?'Could not find clear walls. Trace it with the Outline and Wall tools, or sign in to use AI.':'Could not find clear walls on this plan. Trace it with the Outline and Wall tools.');return;}
    let scaleNote='Scale estimated from the wall thickness. Set it on a labelled room for an exact takeoff.';
    if(labels&&labels.rooms){const W=doc.underlay.w,H=doc.underlay.h;doc.rooms=labels.rooms.map(rm=>({id:uid(),name:rm.name||'Room',type:guessType(rm.name),pt:[rm.x/1000*W,rm.y/1000*H],expect:(rm.width>0&&rm.length>0)?rm.width*rm.length/1e6:null,dims:(rm.width>0&&rm.length>0)?[rm.width,rm.length]:null}));
      invalidate();mergeOpenPlan();const s=autoScale();if(s&&s/doc.scale>0.5&&s/doc.scale<2){doc.scale=s;scaleNote=`Scale set from the room sizes on the plan (1 m = ${fm(1000/s,0)} px).`;}}
    doc.openings.forEach(o=>{if(o.wpx){o.width=Math.max(500,Math.round(o.wpx*doc.scale/10)*10);delete o.wpx;}});
    invalidate();changed(true);setTool('select');const R=rooms();
    flash(`Traced from your plan: ${R.length} rooms, ${doc.walls.length} internal walls, ${doc.openings.length} doors and windows. ${scaleNote} Check the room sizes in Rooms.`);}
  catch(e){flash('Auto trace failed on this file. Trace it with the Outline and Wall tools.');}
  finally{aiBusy=false;renderPlanTab();}}

/* ---------- 3D ---------- */
let three=null;
function init3D(){if(three||!window.THREE)return three;const host=$('#v3');const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));renderer.shadowMap.enabled=true;host.appendChild(renderer.domElement);
  const scene=new THREE.Scene();scene.background=new THREE.Color(getComputedStyle(document.documentElement).getPropertyValue('--scene-bg').trim()||'#dce4e8');
  const camera=new THREE.PerspectiveCamera(40,1,0.1,500);const controls=new THREE.OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.maxPolarAngle=Math.PI*0.495;
  scene.add(new THREE.HemisphereLight(0xffffff,0x556655,0.7));const sun=new THREE.DirectionalLight(0xffffff,0.8);sun.position.set(10,18,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);const sc=sun.shadow.camera;sc.left=-25;sc.right=25;sc.top=25;sc.bottom=-25;scene.add(sun);
  const ground=new THREE.Mesh(new THREE.PlaneGeometry(300,300),new THREE.MeshStandardMaterial({color:0x9aa58c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.position.y=-0.02;ground.receiveShadow=true;scene.add(ground);
  const root=new THREE.Group();scene.add(root);three={renderer,scene,camera,controls,root,host,fitted:false};
  const loop=()=>{requestAnimationFrame(loop);if($('#v3').hidden)return;const w=host.clientWidth,h=host.clientHeight;if(w&&h&&(renderer.domElement.width!==Math.round(w*renderer.getPixelRatio())||renderer.domElement.height!==Math.round(h*renderer.getPixelRatio()))){renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}controls.update();renderer.render(scene,camera);};loop();return three;}
function build3D(){const T=init3D();if(!T)return;const root=T.root;root.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});while(root.children.length)root.remove(root.children[0]);
  if(!scaleMM()||doc.outline.length<3)return;const S=doc.settings,H=S.wallH/1000;const b=bbox(doc.outline);const cx=toM((b.x0+b.x1)/2),cz=toM((b.y0+b.y1)/2);const P=p=>[toM(p[0])-cx,toM(p[1])-cz];
  const extM=new THREE.MeshStandardMaterial({color:S.extClad==='brick'?0xb5755a:0xe8e4da,roughness:0.85}),intM=new THREE.MeshStandardMaterial({color:0xf2f0ea,roughness:0.9}),glass=new THREE.MeshStandardMaterial({color:0x9fc7e0,transparent:true,opacity:0.45}),doorM=new THREE.MeshStandardMaterial({color:0x8a6a4a,roughness:0.6});
  const finCol={tiles:0xd9d6cf,carpet:0x9aa0a6,hybrid:0xc9a77c,timber:0xb07c4f,epoxy:0x8f9aa3,none:0xbdb9b1};
  const sgn=Math.sign(polyArea(doc.outline))||1;
  const box=(x,y,z,sx,sy,sz,ang,m)=>{const me=new THREE.Mesh(new THREE.BoxGeometry(Math.max(sx,0.01),Math.max(sy,0.01),Math.max(sz,0.01)),m);me.position.set(x,y,z);me.rotation.y=ang;me.castShadow=true;me.receiveShadow=true;root.add(me);};
  segs().forEach(s=>{const a=P(s.a),c=P(s.b);const L=Math.hypot(c[0]-a[0],c[1]-a[1]);if(L<0.05)return;const ux=(c[0]-a[0])/L,uz=(c[1]-a[1])/L;const thk=(s.ext?S.extThk:S.intThk)/1000;
    let nx=-uz,nz=ux;if(s.ext){nx*=sgn;nz*=sgn;}const off=s.ext?thk/2:0;const ang=-Math.atan2(uz,ux);const m=s.ext?extM:intM;
    const ops=doc.openings.map(o=>({o,h:hostOf(o)})).filter(x=>x.h&&x.h.s.host===s.host).map(x=>{const c0=x.h.t*L,w=x.o.width/1000;return {a:Math.max(0,c0-w/2),b:Math.min(L,c0+w/2),sill:x.o.type==='window'?x.o.sill/1000:0,h:Math.min(H-0.05,x.o.height/1000),t:x.o.type};}).sort((p,q)=>p.a-q.a);
    const piece=(s0,s1,y0,y1)=>{if(s1-s0<0.01||y1-y0<0.01)return;const mid=(s0+s1)/2;box(a[0]+ux*mid+nx*off,(y0+y1)/2,a[1]+uz*mid+nz*off,s1-s0,y1-y0,thk,ang,m);};
    let cur=0;ops.forEach(o=>{piece(cur,o.a,0,H);piece(o.a,o.b,0,o.sill);piece(o.a,o.b,o.sill+o.h,H);const mid=(o.a+o.b)/2;if(o.t==='window')box(a[0]+ux*mid+nx*off,o.sill+o.h/2,a[1]+uz*mid+nz*off,o.b-o.a,o.h,0.02,ang,glass);else if(o.t==='door'||o.t==='garage')box(a[0]+ux*mid+nx*off,o.h/2,a[1]+uz*mid+nz*off,o.b-o.a,o.h,0.04,ang,o.t==='garage'?extM:doorM);else box(a[0]+ux*mid+nx*off,o.h/2,a[1]+uz*mid+nz*off,o.b-o.a,o.h,0.02,ang,glass);cur=Math.max(cur,o.b);});piece(cur,L,0,H);});
  rooms().forEach(r=>{const sh=new THREE.Shape(r.f.poly.map(p=>{const q=P(p);return new THREE.Vector2(q[0],-q[1]);}));const m=new THREE.Mesh(new THREE.ShapeGeometry(sh),new THREE.MeshStandardMaterial({color:finCol[r.finish]||0xcccccc,roughness:0.9}));m.rotation.x=-Math.PI/2;m.position.y=0.01;m.receiveShadow=true;root.add(m);});
  if(!T.fitted){const span=Math.max(toM(b.x1-b.x0),toM(b.y1-b.y0));T.camera.position.set(span*0.8,span*1.05,span*1.15);T.controls.target.set(0,0.8,0);T.fitted=true;}}
function setView(v){$('#svgwrap').hidden=v!=='2d';$('#v3').hidden=v!=='3d';$('#tools').hidden=v!=='2d';$('#hint').hidden=v!=='2d';document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===v));if(v==='3d')build3D();else{fitIfNeeded();draw();}}
$('#views').addEventListener('click',e=>{const b=e.target.closest('[data-view]');if(b)setView(b.dataset.view);});
let fitted=false;function fitIfNeeded(){if(!fitted){fitView();fitted=true;}}
/* ---------- change pipeline ---------- */
function updateStats(){const sm=scaleMM();const el=$('#stats');if(!sm){el.innerHTML='<b>Scale not set</b>Use the Scale tool on a known dimension<span class="hint">Then trace the outline</span>';return;}
  if(doc.outline.length<3){el.innerHTML='<b>No outline yet</b>Use Outline and tap the outside corners<span class="hint">Or tap AI draft</span>';return;}
  const R=rooms();el.innerHTML=`<b>${fm(outlineArea(),1)} m² footprint</b>${R.length} rooms, ${fm(outlinePer(),1)} m outside walls<span class="hint">${doc.draft?'AI draft: check it against the plan':'Tap a room to edit it'}</span>`;}
function changed(full){invalidate();draw();updateStats();if(full){renderPlanTab();renderRooms();}else{renderPlanTab();if($('#tab-rooms').classList.contains('on'))renderRooms();}scheduleMaterials();if(!$('#v3').hidden)build3D();save();}
/* ---------- Swiftscope bridge ---------- */
function postPlan(){try{const plan=JSON.parse(JSON.stringify(doc));if(plan.underlay&&plan.underlay.path)plan.underlay.src=null;window.parent.postMessage({source:'ss-planner',type:'change',plan,summary:summary()},location.origin);}catch(e){}}
function ensureDims(cb){const U=doc.underlay;if(!U.src||(U.w&&U.h)){cb();return;}const im=new Image();im.onload=()=>{U.w=im.naturalWidth;U.h=im.naturalHeight;cb();};im.onerror=cb;im.src=U.src;}
if(EMBED){window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==window.parent)return;const d=e.data||{};if(d.target!=='ss-planner')return;
  if(d.type==='load'){if(d.meta)META=d.meta;if(d.settings)SETTINGS=Object.assign(SETTINGS,d.settings);PRICEBOOK=(Array.isArray(d.pricebook)?d.pricebook:[]).map(x=>({l:String(x.label||'').toLowerCase(),n:String(x.label||''),p:+x.unit_cost||0})).filter(x=>x.l&&x.p>0);
    const isNew=!d.plan||!Array.isArray(d.plan.outline);doc=migrate(d.plan||{});if(isNew)applyTradeScope(d.trades);if(d.underlayUrl)doc.underlay.src=d.underlayUrl;
    ensureDims(()=>{fitted=false;invalidate();fitIfNeeded();changed(true);setTool(doc.underlay.src&&!doc.scale&&doc.outline.length<3?'scale':doc.outline.length<3?'outline':'select');if(isNew)postPlan();});}
  if(d.type==='meta')META=Object.assign(META,d.meta||{});
  if(d.type==='print'){openPlans();setTimeout(()=>{try{window.print();}catch(_){}},150);}
  if(d.type==='flush'){clearTimeout(saveT);postPlan();}
  if(d.type==='underlay-saved'&&d.path){doc.underlay.path=d.path;save();}
  if(d.type==='underlay-failed'){flash('The plan image could not be saved to your account. It is kept with this build instead.');}});}
/* ---------- start ---------- */
renderToolbar();renderPlanTab();renderRooms();
try{new ResizeObserver(()=>{if(!$('#svgwrap').hidden)draw();}).observe($('#svgwrap'));}catch(e){window.addEventListener('resize',()=>draw());}
ensureDims(()=>{fitIfNeeded();changed(true);setTool(doc.underlay.src&&!scaleMM()?'scale':doc.outline.length<3?'outline':'select');});
setView('2d');
if(EMBED){try{window.parent.postMessage({source:'ss-planner',type:'ready'},location.origin);}catch(e){}}
})();
